# Drives the grouped card layout on /what-is/ (layouts/what-is/list.html).
#
# Each entry under `sections` renders as a labeled group of cards, in the order
# listed here; within a group, pages render in the order their slugs appear.
# A slug is the page's filename without `.md` (e.g. what-is-devops).
#
# Rules the template enforces so the page stays self-maintaining:
#   * A slug listed here that has no matching page is silently skipped, so it's
#     safe to pre-list a page that lives on an unmerged branch.
#   * Any what-is page NOT listed in any section and NOT under `troubleshooting`
#     falls into an "Other concepts" group at the end of the card sections, so a
#     newly added explainer always appears somewhere rather than disappearing.
#   * Pages under `troubleshooting` render as a compact text-link list at the
#     bottom instead of cards — these are CLI recipes and error-resolution
#     snippets that live under /what-is/ for URL reasons but aren't concepts.
#
# When you add a new explainer, add its slug to the most fitting section below.

sections:
  - title: Core concepts
    # `short` is the label used in the section jump-nav; `title` is the heading
    # shown above the rows. Omit `short` to reuse the title.
    short: Core concepts
    slugs:
      - what-is-infrastructure-as-code
      - what-is-pulumi
      - what-is-infrastructure-as-software
