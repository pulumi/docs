# Customers — a frozen, read-only copy of the customer registry.
#
# pulumi/marketing-web owns the registry (apps/www/src/data/customers/) and
# builds /customers/, its industry pages, and every case study. This copy stays
# only for the Hugo pages here that still show customers: the homepage, product
# pages, gads pages, /enterprise, /solutions, and others. Nothing syncs it.
#
# To add or change a customer, do it in marketing-web (apps/www/docs/customers.md).
# Edit this file only when a page built here needs the change too.
#
# Consumers:
#   - layouts/partials/customers/data.html — expands and validates this file once
#     per build; every other consumer goes through it.
#   - layouts/partials/customer-logo.html — renders a customer's logo anywhere.
#   - layouts/partials/customers/href.html — a customer's case-study link.
#   - the template-page partials: logo carousel, logo banner, testimonials,
#     case-study cards and grids.
#
# FIELDS
#   id          Stable lowercase-kebab slug. Unique. Names both logo files in
#               assets/fingerprinted/logos/customers/ (<id>.svg and
#               <id>-on-dark.svg) and is what every page and shortcode refers to.
#   name        Display name, exactly as the company writes it.
#   url         The company's website. Used for the outbound link on surfaces
#               that link out; never rendered as bare text.
#   industry    An id from data/customers_industries.yaml.
#   color       The brand color the logo tile is painted with, as "#RRGGBB".
#               Omitted means a neutral gray tile.
#   logo_scale  Optional multiplier on the logo's rendered size, for dense
#               lockups whose type goes unreadable at the default optical size.
#   fill_text   `light` or `dark`: which way the type goes on a `color` fill.
#               Omit it and the color's luminance decides.
#   tile_logo   `light` when the brand color is light enough that the white
#               on-dark logo would disappear on it.
#   quote       Optional canonical testimonial: `text`, `author`, `title`. The
#               fallback for a testimonial section that names the customer but
#               supplies no quote of its own.
#   case_study  Optional. What the case-study cards and grids show, copied from
#               the case study when it moved to marketing-web: `href` (required;
#               the case study's URL, or wherever it lives if not on
#               /customers/), `title`, `stat`, `stat_label`, `quote`,
#               `attribution`.
#
# RASTER HOLDOUTS
#   `raster_holdouts` lists the customers whose logo is still a PNG (<id>.png)
#   because no SVG could be sourced. They render from the raster and get their
#   dark-surface treatment from a CSS filter instead of a second file.
#
raster_holdouts:
  - 4ir
  - altana
  - cosine
  - dutchie
  - greenpark-sports
  - imagine-learning
  - kyruus
  - mercedes-benz
  - mysten-labs
  - ncics
  - rad-ai
  - tivity-health

