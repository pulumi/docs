# Customers — the single source of truth for every customer Pulumi shows publicly.
#
# One entry per customer: the name, the link, the vertical, the brand color, and
# (by convention, not by key) the two logo files. Every surface that renders a
# customer reads this file and nothing else, so a name change, a rebrand, or a
# new logo is a one-line edit here rather than a hunt through front matter.
#
# Consumers:
#   - layouts/partials/customers/data.html — expands and validates this file once
#     per build; every other consumer goes through it.
#   - layouts/partials/customer-logo.html — renders a customer's logo anywhere.
#   - layouts/partials/customers/{board,cell,tile,filter-bar}.html — /customers/
#     and the /customers/industry/<id>/ term pages.
#   - the template-page partials: logo carousel, logo banner, testimonials,
#     case-study cards and grids.
#   - scripts/lint/lint-markdown.js (checkCustomerRef) — `make lint` fails a
#     page under content/customers/ whose `customer:` is missing or unknown.
#
# ADDING A CUSTOMER
#   1. Add an entry below, in the position you want it to occupy on /customers/
#      (file order is the page order — see "ORDER" below).
#   2. Add two SVGs to assets/fingerprinted/logos/customers/:
#        <id>.svg          for light backgrounds (the grid, testimonials, banners)
#        <id>-on-dark.svg  for the brand-color tile and dark surfaces
#      If the company ships no white variant, derive one:
#        node scripts/customers/derive-on-dark.mjs <id>
#      and check it against a dark background — a derived variant flattens a
#      two-tone mark into one white shape.
#   3. Optional: give a case study `customer: <id>` in its front matter. Case
#      studies are NOT listed here; /customers/ finds them by scanning
#      content/customers/ for that key.
#   4. Run `make build`. The validation partial fails the build on a bad id,
#      an unknown industry, a malformed color, or a missing logo file.
#
# FIELDS
#   id          Stable lowercase-kebab slug. Unique. Names both logo files and
#               is what every page, shortcode, and case study refers to.
#   name        Display name, exactly as the company writes it.
#   url         The company's website. Used for the outbound link on surfaces
#               that link out; never rendered as bare text.
#   industry    An id from data/customers_industries.yaml. A customer belongs to
#               exactly one vertical.
#   color       The brand color the logo tile is painted with, as "#RRGGBB".
#               Omit it and the tile is neutral gray — which is better than a
#               guessed color, so omit rather than invent.
#   logo_scale  Optional multiplier on the logo's rendered size. Surfaces size
#               every logo to the same optical area, derived from its aspect
#               ratio, which is right for a wordmark and wrong for a dense
#               lockup whose type goes unreadable at that size. Use it sparingly
#               and only for those — it is a correction, not a preference.
#   fill_text   `light` or `dark`: which way the type goes on a surface filled
#               with `color`. Omit it and the color decides, by a luminance
#               reading of where white type stops being readable. Set it when
#               the brand has its own view — Snowflake's blue reads as light by
#               that measure but their own material puts white on it.
#   tile_logo   Set to `light` when the brand color is light enough that the
#               on-dark (white) logo would disappear on it. Default: the tile
#               shows <id>-on-dark.svg. A customer with no `color` always gets
#               the light logo, since the fallback tile is gray.
#   quote       Optional canonical testimonial: `text`, `author`, `title`. Used
#               on /customers/ for a customer who has no case study (the cell
#               widens to two columns and renders the quote), and as the
#               fallback for a testimonial section that names the customer but
#               supplies no quote of its own. Product pages keep their own
#               product-specific quote text — this is the customer's, not a
#               page's.
#
# ORDER
#   File order is the only ordering mechanism, at every level. There is no
#   `weight` and nothing sorts. /customers/ renders these entries top to bottom,
#   so the most recognizable customers belong at the top.
#
# VOCABULARY
#   "Customer", never "logo", "account", or "case study". A case study is a page
#   about a customer; a customer is an entry here, with or without one.
#
# RASTER HOLDOUTS
#   `raster_holdouts` lists the customers whose logo is still a PNG (<id>.png)
#   because no SVG could be sourced. They render from the raster and get their
#   dark-surface treatment from a CSS filter instead of a second file. This list
#   exists to make the exceptions visible and must only ever SHRINK: when you
#   find an SVG for one, add the two SVGs, delete the PNG, and remove the id.
#   Do not add to it — a customer with no obtainable SVG stays out of the file.
#
raster_holdouts:
  - 4ir
  - altana
  - cosine
  - dutchie
  - greenpark-sports
  - imagine-learning
  - kyruus
  - mercedes-benz
  - mysten-labs
  - ncics
  - rad-ai
  - tivity-health

