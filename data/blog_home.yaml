# Blog homepage configuration — consumed by layouts/blog/list.html.

# Homepage featured slots (0–4). Each entry maps to ONE slot by position:
#   slot 1 = the large featured hero, slots 2–4 = the small cards beside it.
# An entry is either:
#   - a post slug (the folder name under content/blog/) — pins that post to the slot
#   - auto — fills the slot with the next newest post whose category isn't `general`
# Slots past the list also auto-fill, and `auto` skips posts pinned to other slots,
# so nothing is duplicated. Featured posts are excluded from the feed below the
# fold, and the set is computed identically on every /blog/page/N/ so pagination
# stays stable.
#
# Examples:
#   featured: []                            # all four slots auto-fill (default)
#   featured: [my-big-launch]               # pin to slot 1 (hero); 2–4 auto-fill
#   featured: [auto, my-editors-pick]       # slot 1 = latest post, slot 2 = pinned
#   featured: [auto, pick-a, auto, pick-b]  # slots 1 & 3 latest; slots 2 & 4 pinned
featured:
  - pulumi-context-api

# Optional list of up to 4 series slugs (from data/blog_series.yml) for the
# "Popular series" strip. Defaults to the first 4 entries of blog_series.yml,
# which is maintained newest-first.
featured_series:
  - neo-things
  - iac-best-practices
  - platform-engineering-pillars
  - kubernetes-getting-started
