# Case-study industries — the "what vertical is this customer in" taxonomy.
#
# This file is the single source of truth for the set of industries a case
# study may declare in its `industry:` front matter. It is consumed by:
#   - scripts/lint/lint-markdown.js (checkCaseStudyIndustry): `make lint` fails
#     any content/case-studies/*.md whose `industry:` is missing, is a list, or
#     is a value not listed here.
#   - layouts/taxonomy/industry.html and industry.terms.html: term-page title +
#     description and the /case-studies/industry/ directory both read from here.
#   - layouts/case-studies/list.html: the industry nav on the index.
#
# Industry is SINGULAR and REQUIRED: every case study declares exactly one
# `industry:` value (a YAML scalar, e.g. `industry: healthcare`). Never a list —
# a customer belongs to one vertical. The set is CLOSED; to add, rename, or
# retire an industry, edit THIS file in a PR (the id is the stable slug, so
# changing it changes the /case-studies/industry/<slug>/ URL — add an alias if
# you rename one).
#
# This is a dedicated, non-blog taxonomy: term pages live under /case-studies/,
# not /blog/, and emit no RSS (scoped to HTML-only in config/_default/config.yml).
#
# FIELDS
#   id          Stable slug used in front matter, by the linter, and in the URL.
#   name        Human-readable display name (term-page heading, nav label).
#   description Reader-facing blurb shown on the industry term page header and as
#               its meta/og description. Write it for site visitors.
#
industries:
  - id: financial-services
    name: "Financial Services & Insurance"
    description: >-
      How banks, lenders, and insurers use Pulumi to modernize infrastructure
      while meeting security and compliance requirements.

  - id: security
