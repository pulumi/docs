# The text content of the homepage hero animation (the agent-loop scene):
# the Pulumi program the agent types and the pulumi up stream in the terminal.
#
# To change either, edit the plain-text sources below, then run
#
#   yarn --cwd theme gen:hero-text
#
# which re-highlights them with shiki (min-light theme; TypeScript for the
# editor, bash for the terminal — the same highlighting the storyboards used)
# and rewrites the generated colors/editor/terminal sections underneath.
# Nothing runs at build or page-load time; the runs below are what
# layouts/partials/template-partials/hero-animation/_code-lines.html renders,
# with every x position derived from monospace column math (Monaspace Neon,
# 7.44141px advance at font-size 12). A blank line is a blank row. If you add
# or remove terminal rows, shift TERM_SCROLL_END in
# theme/src/ts/hero-animation.ts by 18px per row.

editor_source: |
  import * as aws from "@pulumi/aws";
  import * as awsx from "@pulumi/awsx";

  const vpc = new awsx.ec2.Vpc("vpc");
  const azs = await aws.getAvailabilityZones({ state: "available" });

  const subnets = azs.names.map((az, i) =>
    new aws.ec2.Subnet(`subnet-${i}`, {
      vpcId: vpc.vpcId,
      cidrBlock: `10.0.${i}.0/24`,
      availabilityZone: az,
    })
  );

