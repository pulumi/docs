# The text content of the homepage hero animation (the agent-loop scene):
# the Pulumi program the agent types and the pulumi up stream in the terminal.
# Rendered by layouts/partials/template-partials/hero-animation/_code-lines.html.
#
# Each line is a list of [color, text] runs; colors are keys into the palette
# below. The font is monospace (Monaspace Neon, 7.44141px advance at
# font-size 12), so every run's x position is derived from the number of
# characters before it — to change the text, just edit the strings, and use
# literal spaces for indentation and column alignment. An empty list is a
# blank line. The editor's per-line typing duration is derived from line
# length automatically.
#
# The palette is the storyboard's GitHub-light syntax scheme.

colors:
  kw: "#D32F2F" # keywords
  id: "#1976D2" # identifiers
  str: "#22863A" # strings
  mem: "#6F42C1" # members, methods; terminal headings
  txt: "#24292E" # plain text
  pun: "#212121" # punctuation
  tbl: "#2B5581" # terminal resource table + tree glyphs

editor:
  - - [kw, "import"]
    - [id, " *"]
    - [kw, " as"]
    - [txt, " aws "]
    - [kw, "from"]
    - [str, " \"@pulumi/aws\""]
    - [txt, ";"]
  - - [kw, "import"]
    - [id, " *"]
    - [kw, " as"]
    - [txt, " awsx "]
    - [kw, "from"]
    - [str, " \"@pulumi/awsx\""]
    - [txt, ";"]
  - []
  - - [kw, "const"]
    - [id, " vpc"]
    - [kw, " ="]
    - [kw, " new"]
    - [id, " awsx"]
    - [mem, "."]
    - [id, "ec2"]
    - [mem, ".Vpc"]
    - [txt, "("]
    - [str, "\"vpc\""]
    - [txt, ");"]
  - - [kw, "const"]
    - [id, " azs"]
    - [kw, " ="]
    - [kw, " await"]
    - [id, " aws"]
    - [mem, ".getAvailabilityZones"]
    - [txt, "({ state"]
    - [kw, ":"]
    - [str, " \"available\""]
    - [txt, " });"]
  - []
  - - [kw, "const"]
    - [id, " subnets"]
    - [kw, " ="]
    - [id, " azs"]
    - [mem, "."]
    - [id, "names"]
    - [mem, ".map"]
    - [txt, "((az"]
    - [pun, ","]
    - [txt, " i) "]
    - [kw, "=>"]
  - - [kw, "  new"]
    - [id, " aws"]
    - [mem, "."]
    - [id, "ec2"]
    - [mem, ".Subnet"]
    - [txt, "("]
    - [str, "`subnet-"]
    - [kw, "${"]
    - [txt, "i"]
    - [kw, "}"]
    - [str, "`"]
    - [pun, ","]
    - [txt, " {"]
  - - [txt, "    vpcId"]
    - [kw, ":"]
    - [id, " vpc"]
    - [txt, ".vpcId"]
    - [pun, ","]
  - - [txt, "    cidrBlock"]
    - [kw, ":"]
    - [str, " `10.0."]
    - [kw, "${"]
    - [txt, "i"]
    - [kw, "}"]
    - [str, ".0/24`"]
    - [pun, ","]
  - - [txt, "    availabilityZone"]
    - [kw, ":"]
    - [txt, " az"]
    - [pun, ","]
  - - [txt, "  })"]
  - - [txt, ");"]

