# Customer industries — a frozen, read-only copy of pulumi/marketing-web's
# apps/www/src/data/customers/industries.yaml, which owns the set and builds the
# /customers/industry/<id>/ pages. Nothing syncs it.
#
# Here it only validates data/customers.yaml: layouts/partials/customers/data.html
# fails the build on a registry entry whose `industry:` isn't an id listed here.
#
# FIELDS
#   id          Stable slug, matching marketing-web's.
#   name        Human-readable display name.
#   description Blurb carried over from the old term pages; nothing here reads it.
#
industries:
