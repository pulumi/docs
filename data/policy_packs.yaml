        weight: 3

  - id: nist
    menu: reference-pre-built-policy-packs-nist
    framework: NIST SP 800-53
    packs:
      - pack: nist-aws
        slug: aws
        title: AWS
        h1: NIST SP 800-53 - AWS
        metaDesc: Complete list of NIST SP 800-53 compliance policies for AWS.
        weight: 1
      - pack: nist-azure
        slug: azure
        title: Azure
        h1: NIST SP 800-53 - Azure
        metaDesc: Complete list of NIST SP 800-53 compliance policies for Azure.
        weight: 2
      - pack: nist-google-cloud
        slug: google-cloud
