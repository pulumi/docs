# Which pre-built policy packs get a reference page under
# /docs/reference/pre-built-policy-packs/, and what those pages are called.
#
# This file is the hand-maintained editorial layer. The policy data itself is NOT
# here: scripts/fetch-policy-packs.js pulls it from the Pulumi Cloud API into
# data/policy_pack_policies/<pack>.json, and
# content/docs/reference/pre-built-policy-packs/_content.gotmpl generates one page
# per entry below. To document a newly published pack, add an entry here -- no new
# Markdown file is needed.
#
# THE RULE: only document packs that are built from the pulumi/policy-packs-internal
# repo AND are published as Pulumi products.
#
# Both halves matter, and the second is not implied by the first. A pack can be built
# there, publish cleanly, and be returned by /api/orgs/pulumi/policypacks while still
# being private to the org -- that endpoint lists what the org holds, not what we sell.
# That is exactly how hitrust-awsnative got a public reference page (pulumi/docs#21055).
#
# Both halves are enforced by scripts/fetch-policy-packs.js, so a bad entry fails the
# nightly job rather than publishing a page:
#
#   built there     every entry must carry a `source:` naming its packs/... directory.
#   a product       the registry listing for the org must return the pack with
#                   `source: "pulumi"`. Privately published packs come back
#                   `source: "private"` instead, and a deleted one not at all.
#
# Note the pack's own `source:` key below is the repo directory, unrelated to the
# registry's `source` field. And do not switch that check to `publisher`: every pack in
# our org is published by pulumi, so it would admit the private ones too.
#
# This is why the file is an allowlist rather than "document everything in the org".
# The `pulumi` org is also where we publish policy packs for our OWN internal use,
# plus experiments and customer one-offs -- pulumi-internal-policies,
# pulumi-vanta-policies, super-policy, auto-policy, testpack-aws-api,
# hitrust-aws-test, and others. Those are not products and must never be documented.
# Enumerating the org would publish them all.
#
# Every entry therefore carries a `source:` naming the directory in
# policy-packs-internal that builds it. scripts/fetch-policy-packs.js refuses to run
# if an entry lacks one, so an internal-use pack cannot be added without someone
# first having to claim a repo path for it -- at which point it is obvious it has none.
#
# To re-derive the `source:` values, or audit this list after packs are added:
#
#   # in a policy-packs-internal checkout
#   grep -rn 'new PolicyPack("[^"]*"' packs --include=index.ts \
#     | sed -E 's|^packs/(.*)/index.ts:[0-9]+:.*new PolicyPack\("([^"]*)".*|\2 packs/\1|' \
#     | sort
#
# Menu group headers (`menu:` below) are defined in config/_default/menus.yml.

org: pulumi

