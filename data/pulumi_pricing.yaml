# What Pulumi sells: the Pulumi Cloud editions, and which edition each feature
# needs. Single source of truth for the /pricing/ comparison table, the
# `pulumi_cloud_feature:` docs marker, the {{< pulumi-cloud >}} shortcode, and the
# changelog `editions:` badges.
#
# This file describes the product, not any page. Nothing in it names a page, a
# section, a table, a row, or a column — the pricing page's accordion is one
# *rendering* of this taxonomy, and a docs callout reads the same file without
# inheriting that shape.
#
# -----------------------------------------------------------------------------
# VOCABULARY
# -----------------------------------------------------------------------------
# The collective noun is "edition" — not "plan", "tier", or "subscription":
#
#   - "plan" collides with Neo's Plan mode and `pulumi preview --save-plan`.
#   - "tier" is absent from the product UI (it means usage tier, not edition).
#   - "subscription" is the billing record, not the edition itself.
#
# The editions are Free, Essentials, Pro, and Enterprise+ (September 2026; they
# were Individual, Team, Enterprise, and Business Critical). Two of those names
# now do double duty, so be precise:
#
#   - "Pro" is an edition again. It was also a pre-2023 grandfathered SKU, as
#     was "Starter" — write "the legacy Pro SKU" when you mean that one.
#   - "Enterprise" on its own is ambiguous between the old Enterprise edition,
#     which is now Pro, and Enterprise+. Never use it bare of an edition.
#
# Edition names are lowercase-noun in prose ("the Enterprise+ edition"), per the
# brand rule against overcapitalizing concepts. "Free" is capitalized only where
# it names the edition; as an adjective it stays lowercase ("free forever").
#
# -----------------------------------------------------------------------------
# ORDER MATTERS
# -----------------------------------------------------------------------------
# List order is the only ordering mechanism, at every level. There is no
# `weight` and nothing is sorted at render time.
#
#   editions[]   pricing card order, comparison column order, and the
#                "the Essentials, Pro, and Enterprise+ editions"
#                expansion in availability markers. The product never says
#                "and above" — it enumerates — so that sentence is generated
#                from this one list rather than written by hand on each page.
#   groups[]     order of the coarse bands on /pricing/. There is one band
#                today — the tables are a flat list of product areas, mirroring
#                the sections of /docs/ — but the level stays so splitting them
#                again is an edit here rather than a template change.
#   categories[] order of the product tables within a band.
#   features[]   row order within a table.
#
# -----------------------------------------------------------------------------
# FEATURES
# -----------------------------------------------------------------------------
# Every feature needs an `id` that is unique across *all* categories. Ids are
# not slugged from names, because names collide ("Self-hosting" and "On-demand
# resource price" each appear under more than one product) — disambiguate with a
# product prefix (`esc-self-hosting`). Charset: ^[a-z0-9][a-z0-9-]*$, because
# Hugo's map lookups are case-insensitive and would collapse `RBAC` into `rbac`.
#
# Availability is expressed two ways, which compose:
#
#   available_from: <edition-id>   Unavailable below that edition, available
#                                  from it up. 40-odd features are exactly this.
#   availability: {<edition-id>: <value>}
#                                  Overlays specific editions on top of
#                                  `available_from`. A value is:
#                                    true            a check mark
#                                    false / omitted a dash
#                                    a string        rendered as Markdown
#                                    a map           {content, subtext, tooltip}
#
# Availability must be monotone: once a feature is available it stays available
# in every higher edition. The build fails otherwise, because the generated
# marker sentence enumerates "this edition and everything above it". A feature
# with `requires:` is the one exception — see below.
#
# Quote any string cell that could be read as a YAML 1.1 boolean — `no`, `yes`,
# `on`, `off`, `y`, `n` all parse as bools unquoted. `make lint` rejects them.
#
# Other per-feature keys:
#
#   link / tooltip   decoration for the comparison row.
#   hidden: true     not a marketed line item: left out of the comparison table,
#                    but still resolvable by id from a docs marker.
#   requires: <edition-id>
#                    the edition a docs marker should name, when it differs from
#                    the first edition with a truthy cell. Needed wherever the
#                    free column is a *limited variant* of the feature rather
#                    than the feature itself ("Manual" policy enforcement).
#                    It only ever *raises* that edition, so it has to name one
#                    above the first truthy cell — the build fails otherwise,
#                    since a lower value would make every marker contradict the
#                    row it deep-links to. The feature also has to be available
#                    at that edition and every edition above it.
#
#                    Setting it is what declares the cells BELOW it to be
#                    variants rather than availability, so monotonicity is
#                    enforced from `requires:` up and a lower cell may say
#                    anything. Preventative policies is the row that needs it:
#                    Free reads "Manual", Essentials is blank, and the feature
#                    itself starts at Pro.
#
# -----------------------------------------------------------------------------
# CALCULATOR
# -----------------------------------------------------------------------------
# The `calculator:` block holds the *numbers* behind the same prices the
# comparison rows state in prose ("$0.00025/hour"), so the estimator on
# /pricing/ and the markdown output can do arithmetic with them. It is a
# separate block rather than extra keys on the rows because a cell is display
# copy — it carries "Starting at", a subtext, and a Custom column — and parsing
# a dollar figure back out of it would make every copy edit a pricing change.
#
# When you change a rate, change it in BOTH places: the feature cell a reader
# reads and the calculator meter the estimator computes with. There is no
# derivation between them.
#
# `calculator.editions` is keyed by edition id and only covers the editions the
# estimator offers (Free has no bill; Enterprise+ is quoted), so it is
# deliberately not a full row of the editions list above.
#
# The metered rates here are the MONTHLY ones — the figure each comparison cell
# carries as its subtext — even though billing is hourly. Rounding runs in both
# directions between the two published forms (an ESC secret is $0.000685/hour
# and $0.50/month, but 0.000685 x 730 is 0.50005; an Essentials discovered
# resource is $0.000025/hour and $0.0185/month, but 0.000025 x 730 is 0.01825),
# so a calculator that multiplied the hourly rate out would quote figures that
# contradict the table directly below it. Storing the monthly rate keeps every
# number on the page identical. The estimator prices whole months and says so;
# it has no utilization control and no hours constant.
#
# -----------------------------------------------------------------------------
# ADDING OR RENAMING
# -----------------------------------------------------------------------------
# Edit this file only. layouts/partials/pricing/data.html expands it and raises
# every structural error; layouts/partials/pricing/calculator.html validates the
# part of the `calculator:` block the estimator reads and
# layouts/partials/pricing/card-usage.html validates `card_tooltip`, the part
# only the cards render; scripts/lint/lint-markdown.js
# validates the frontmatter and shortcode values that point at it. Renaming a
# feature id is a breaking change — grep for `pulumi_cloud_feature:` and
# `pulumi-cloud "` first.

editions:
  - id: free
    name: Free
    card:
      subtitle: Get started with Pulumi-managed infrastructure at no cost.
      price: $0
      note: No credit card required
      cta:
        label: Get started
        href: https://app.pulumi.com/signup
        style: outline
        data_role: cta-get-started
      features_intro: "Includes:"
      features:
        - 1 user
        - IaC state management
        - Unlimited projects, stacks, and environments
        - Unlimited updates and history
        - Up to 2,000 managed resources
        - Up to 500 workflow minutes

  - id: essentials
    name: Essentials
    card:
      subtitle: Managed infrastructure fundamentals for your whole team.
      price: $40
      price_label: /month base
      unit: "**Includes 40 Credits**"
      # The (i) tooltip on this note lists what a Credit buys per meter; the
      # rates come from `calculator:` below, keyed by this edition's id.
      note: Up to 500 resources, additional usage billed on demand
      cta:
        label: Start with Essentials
        href: https://app.pulumi.com/signup?create-organization=1
        style: primary
      features_intro: "Everything in **Free**, plus:"
      features:
        - Unlimited users
        - Secure collaboration and CI/CD
        - Neo code reviews and Slack integration
        - Resource Search and Property Search
        - OIDC and org access tokens
        - Webhooks
        - Automatic secrets rotation
        - Policy results in advisory mode

  - id: pro
    name: Pro
    card:
      subtitle: Automation and built-in governance for growing organizations.
      badge: Popular
      price: $400
      price_label: /month base
      unit: "**Includes 400 Credits**"
      note: Up to 2,000 resources, additional usage billed on demand
      cta:
        label: Start with Pro
        href: https://app.pulumi.com/signup?create-organization=1
        style: primary
      cta_secondary:
        label: Contact sales
        href: /contact/?form=sales
      features_intro: "Everything in **Essentials**, plus:"
      features:
        - SAML/SSO and advanced RBAC
        - Organization-managed policy enforcement
        - Preventative policies
        - Custom policy packs
        - Neo scheduled tasks
        - Internal developer platform (IDP)
        - Audit logs and automated export
        - Drift detection and remediation
        - Time-to-live stacks
        - Customer-managed keys

  - id: enterprise-plus
    name: Enterprise+
    card:
      subtitle: Compliance, control, and governance for at-scale operations.
      # A phrase rather than a figure, so it renders at the smaller size; the
      # list rate is carried by `unit` below. See layouts/page/pricing.html.
      price: Contact sales
      price_style: phrase
      unit: "**$0.5475 per managed resource-month**"
      note: List rate, with custom volume pricing and invoicing
      cta:
        label: Contact sales
        href: /contact/?form=sales
        style: primary
      features_intro: "Everything in **Pro**, plus:"
      features:
        - "[Self-hosting available](/product/self-hosted)"
        - Conformance packs for NIST, PCI DSS, HITRUST, SOC 2, CIS, and more
        - Automatic group & user sync (SCIM)
        - Unlimited custom policy packs
        - Policy remediation
        - Multi-year contracted credit pools
        - Volume pricing and invoicing

calculator:
  # Above this many IaC resources the calculator keeps quoting a price but
  # flags that volume pricing usually applies at that size, so the list-rate
  # figure is an upper bound rather than a quote. Counted in resources rather
  # than dollars because resource count is the number the reader typed and can
  # reason about; a dollar threshold moves whenever any rate on this page does.
  contact_sales_resources: 3000
  # Meters priced the same on every edition the calculator offers.
  meters:
    workflow_minute: 0.01
    neo_tokens_per_million: 3
  editions:
    essentials:
      base_usd: 40
      included_credits: 40
      included_resources: 500
      iac_resource_month: 0.1825
      esc_secret_month: 0.50
      insights_resource_month: 0.0185
    pro:
      base_usd: 400
      included_credits: 400
      included_resources: 2000
      iac_resource_month: 0.365
      esc_secret_month: 0.75
      insights_resource_month: 0.0365
  # What a Credit buys, per meter, for the (i) tooltip on each card's "additional
  # usage" note. This is a *view* of the rates above, not a second copy of them:
  # `key` names one of the per-edition rates or shared meters, and the card
  # resolves it for its own edition — so an edition gets the tooltip exactly when
  # the estimator prices it, and there is no number here to fall out of date. A
  # Credit is $1, so these are also the dollar rates: they still have to match
  # the monthly subtext on the on-demand rows below (iac-on-demand-price,
  # esc-on-demand-price, insights-on-demand-price, workflow-minutes-price, neo),
  # which is the one copy of these figures this file still keeps by hand — but
  # that agreement is now the estimator's to keep, not the cards'.
  #
  # Not every meter belongs: esc-api-call-price is free to 10K and priced per 10K
  # rather than per unit, so it stays in the comparison table below.
  #
  # `from` lists the editions where the rate is a floor rather than the price,
  # mirroring the "Starting at" in those editions' comparison cells.
  card_tooltip:
    intro: "Additional usage, in Credits (1 Credit = $1)"
    rates:
      - label: 1 IaC resource
        key: iac_resource_month
        suffix: /month
        from: [pro]
      - label: 1 managed secret
        key: esc_secret_month
        suffix: /month
      - label: 1 discovered resource
        key: insights_resource_month
        suffix: /month
        from: [pro]
      - label: 1 workflow minute
        key: workflow_minute
      - label: 1M Neo tokens
        key: neo_tokens_per_million

