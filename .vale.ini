StylesPath = styles

# Hide suggestion-level rules; surface warnings and errors only.
# Vale findings are nags routed to the docs-review pipeline; suggestions
# are too noisy on existing technical prose to be useful.
MinAlertLevel = warning

Packages = Google, write-good

[*.md]
BasedOnStyles = Pulumi, Google, write-good

# Skip Hugo shortcodes in both forms ({{< >}} and {{% %}}), including
# closing tags. Vale would otherwise treat them as prose and false-flag
# attribute names and template arguments.
BlockIgnores = (?s) *({{[%<].*?[%>]}}.*?{{[%<] */[a-zA-Z][a-zA-Z0-9_-]* *[%>]}}), \
               (?s) *({{[%<].*?[%>]}})
TokenIgnores = ({{[%<].*?[%>]}}), \
               (\{\{[^}]+\}\})

# Disable Google rules that conflict with Pulumi house style (brand.pulumi.com
# is the source of truth; these mirror its writing-style/voice sections offline).
Google.Headings = NO        # Replaced by Pulumi.HeadingSentenceCase (all levels, H1 included). Front-matter titles — the site's usual H1s — reach that rule via scripts/lint/frontmatter-title-case.py in `make lint-prose`: Vale does read front matter (substitution rules like Pulumi.RetiredNames match a title_tag: today), but HeadingSentenceCase is scoped to headings, and front matter isn't parsed as one.
Google.Quotes = NO          # Brand puts commas/periods OUTSIDE closing quotes (logical style); Google's rule forces them inside.
Google.WordList = NO        # Google product-name overrides don't match Pulumi terminology.
Google.We = NO              # Blanket first-person flagger; replaced by Pulumi.NarrativeWe, which targets only narrative-walkthrough constructions (let's / we'll / now we ...), not every 'we'.
Google.Will = NO            # Too noisy on declarative technical prose (flags every 'will'); replaced by Pulumi.FutureTense, which anchors on product subjects.
Google.Parens = NO          # Vague rule ("use parens judiciously"); not actionable.
Google.EmDash = NO          # Noisy on existing technical prose; false-positive rate exceeds signal.
Google.Colons = NO          # Flags all ': A' but Google's guide permits capital after a colon when a complete sentence follows ("Note: This operation...").
Google.Latin = NO           # 'e.g.' / 'i.e.' are dev-doc standard; 303 historical cases in docs/.
Google.Exclamation = NO     # 97% of hits are in blog posts where exclamations are voice, not error.
Google.OxfordComma = NO     # Regex can't distinguish serial lists from introductory clauses ("..., X and Y" after a subordinate clause); false-positive rate exceeds signal. Real list-comma issues are caught in prose review.

# Disable write-good rules that double-flag with Google or are impractical.
write-good.Passive = NO     # Google.Passive covers the same ground; one finding per construct.
write-good.E-Prime = NO     # Banning all forms of "to be" is impractical for technical docs.

# Per-path overrides. Vale merges sections; more-specific wins on conflicts.
[content/blog/**/*.md]
# The brand guide's Names & terminology section is explicit that "historical
# usage is fine ... dated blog posts should remain as they are", so the
# terminology-correctness rules are off for the blog archive: a 2022 post that
# says "Pulumi Insights" is a record of what the product was called then, not a
# defect. Retiring a name would otherwise turn every one of the ~105 archived
# posts mentioning a renamed product into a blocker finding on any PR that
# touches it. New posts are covered by review, not by rewriting the archive.
Pulumi.Substitutions = NO
Pulumi.RetiredNames = NO
Pulumi.DeprecatedProductNames = NO
Pulumi.Nomenclature = NO
# Pulumi.ThirdPartyNames and Pulumi.Spelling are deliberately NOT exempted
# here. The carve-out above is about preserving a historical record: a 2022
# post saying "Pulumi Insights" documents what the product was called. "Github"
# and "Hashicorp" document nothing -- they were never how those projects spell
# their own names, and correcting one changes no meaning and falsifies no
# history. Both rules are diff-scoped like every other, so they only ever fire
# on a line an author is writing today; measured per-post spelling density on
# the archive is 0-5 findings, and Spelling is advisory besides.
Google.FirstPerson = NO     # Blog posts are written in author voice; 'I'/'my'/'me' are the medium.
Pulumi.FutureTense = NO     # Blog voice is exempt from the docs present-tense norm; announcements legitimately describe upcoming behavior.
Pulumi.NarrativeWe = NO     # Blog voice is exempt; narrative first-person plural is the medium.

[content/{what-is,learn}/**/*.md]
Pulumi.NarrativeWe = NO     # Narrative-voice norm is scoped to docs and tutorials per the writing-style audit; explainer voice is out of scope.

[content/docs/iac/cli/commands/**/*.md]
Pulumi.HeadingSentenceCase = NO  # Generated from `pulumi gen-docs`; the cobra `### SEE ALSO` headings are fixed boilerplate, not hand-authored prose.
Pulumi.CrossReferenceHeadings = NO  # Same generated pages; the cobra `SEE ALSO` blocks are tooling output, not hand-authored cross-references.
Pulumi.FutureTense = NO     # Generated from `pulumi gen-docs`; tense fixes belong upstream in pulumi/pulumi.
Pulumi.NarrativeWe = NO     # Same generated pages; not hand-authored prose.
Pulumi.Substitutions = NO   # Same generated pages; the CLI still ships `pulumi insights ...` commands, so its help text legitimately carries the old names. Terminology fixes belong upstream in pulumi/pulumi.
Pulumi.RetiredNames = NO    # Same rationale as Substitutions above.
Pulumi.DeprecatedProductNames = NO  # Same rationale as Substitutions above.
Pulumi.Nomenclature = NO    # Same rationale; generated help text mirrors upstream casing.
Pulumi.Spelling = NO        # Same rationale; the help text is full of flag and command fragments that aren't prose.

[content/docs/integrations/clouds/kubernetes/pulumi-kubernetes-operator/**/*.md]
Pulumi.Overcapitalization = NO  # This subtree's capitalized "Stack" is the operator's Kubernetes CRD Kind name (a genuine proper noun, like "Pod" or "Deployment"), not the generic IaC concept -- confirmed by _index.md's own description of the operator's custom resources.

[content/docs/integrations/version-control/azure-devops-integration.md]
Pulumi.DeprecatedProductNames = NO  # This page's "Pulumi Service" is the literal name of the group the integration creates in Azure DevOps ("Pulumi creates a group named **Pulumi Service (`<your-pulumi-org>`)**"), not prose. Renaming it here would misdocument the actual UI string; the rename has to happen in the product first.

[content/docs/iac/guides/clouds/aws/cdk.md]
Pulumi.Overcapitalization = NO  # This page's capitalized "Stack" is almost always the literal `pulumicdk.Stack` class identifier (see the surrounding `new pulumicdk.Stack(...)` code samples), not the generic concept.

[content/docs/iac/operations/continuous-delivery/argocd.md]
Pulumi.Overcapitalization = NO  # This page's capitalized "Stack" is the operator's `Stack` custom resource (a proper noun, consistently backticked elsewhere on the page), not the generic concept.

# Same Kubernetes-CRD-Kind false positive as the docs subtree above, but in the
# blog posts that introduce and update the Pulumi Kubernetes Operator (each
# confirmed by grep: `kind: Stack`, "the `Stack` Custom Resource", "PKO Stack
# resource", etc.).
[content/blog/pko-2-0-ga/index.md]
Pulumi.Overcapitalization = NO
[content/blog/pulumi-kubernetes-operator/index.md]
Pulumi.Overcapitalization = NO
[content/blog/pulumi-kubernetes-operator-2-3/index.md]
Pulumi.Overcapitalization = NO
[content/blog/pulumi-kubernetes-operator-and-kargo/index.md]
Pulumi.Overcapitalization = NO
[content/blog/pulumi-kubernetes-operator-2-0/index.md]
Pulumi.Overcapitalization = NO

[content/blog/stack-readme/index.md]
Pulumi.Overcapitalization = NO  # This 2019 post treats "Stack" as a UI feature name throughout ("the Stack page", "Stack outputs", "Stack 'Production'") -- a self-consistent, if non-house-style, voice baked into the whole piece rather than a scattered slip. Rewriting it end to end is a larger editorial pass than this rule's scope.


