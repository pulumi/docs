{{ $items := index .Page.Params.integration_groups (.Get 0) }}
<div class="tiles flex flex-wrap items-stretch">
    {{ range $items }}
        <div class="w-full md:w-1/3 pb-4 md:pr-4">
            <a href="{{ .link }}" class="tile flex items-center gap-2 p-3 h-full">
                <img src="{{ .image }}" alt="" width="24" height="24" class="h-6 w-6 object-contain flex-shrink-0 m-0">
                <span>{{ .name }}</span>
            </a>
        </div>
    {{ end }}
</div>
