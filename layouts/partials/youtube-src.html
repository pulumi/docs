{{- /*
  Consent-aware YouTube iframe source. Returns the attribute an <iframe> should
  carry for a YouTube embed URL: data-pulumi-consent-src="<url>" (no src), so
  the YouTube iframe does not load, and sets no YouTube cookies, until the
  visitor allows Targeting (C0004). theme/src/ts/consent-media.ts promotes it
  to src then.

  Usage (inside an <iframe> tag):
      <iframe {{ partial "youtube-src.html" (dict "url" $embedURL) }} ...>

  Callers only pass the URL. It returns a safeHTMLAttr value rather than printing text:
  html/template only accepts an HTMLAttr in attribute-name position inside a
  tag, and replaces anything else (including a partial's plain output) with
  "ZgotmplZ".
*/ -}}
{{- return (printf `data-pulumi-consent-src="%s"` (htmlEscape .url) | safeHTMLAttr) -}}
