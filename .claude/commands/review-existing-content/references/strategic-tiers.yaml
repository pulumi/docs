# Strategic tiers for automated existing-content review.
#
# This file is the single source of truth for the selection inputs consumed
# by `scripts/content-review/select-articles.py`:
#
#   tier      — strategic value weight in the priority score.
#                 1 = flagship  (weight 1.0): onboarding and core concepts;
#                     factual drift here is most damaging.
#                 2 = important (weight 0.6): major product areas.
#                 3 = default   (weight 0.3): everything else. Pages with no
#                     matching prefix are tier 3 — you only need an entry to
#                     promote, demote, or exclude.
#                 0 = shorthand for `editable: false` + `reviewable: false`
#                     (see below): a tree we neither edit nor look at.
#   editable   — may a PR change these files? Default true. Set false for a
#                tree a GENERATOR owns: it overwrites any hand edit on its next
#                run, so a fix, a glow-up, or a snippet sweep there is spend
#                thrown away. This is what "tier 0" always meant.
#   reviewable — may the pipeline READ these pages and record what they claim?
#                Default true. This is a different question from `editable`,
#                and merging the two is the bug pulumi/docs#20996 fixed:
#                selection is the only thing that ever writes a page's claim
#                list, so a tree marked tier 0 was not "checked and fine", it
#                was never fact-checked once — 254 pages, 30% of content/docs/.
#                `editable: false` + `reviewable: true` queues the tree for the
#                report-only lane: extract and verify its claims, record them
#                to the claims index for the nightly re-verify, change nothing.
#                Contradictions found there route upstream to the repo that
#                owns the text (references/upstream-claims.yaml), never to a
#                stale-claims marker no PR in this repo could ever retire.
#   no_retire — hard veto: review must never propose retiring a matching page,
#               regardless of evidence. This is the PRIMARY retirement
#               guardrail (retirement is no longer gated to a lane). Tier 1
#               implies no_retire; set it explicitly on lower tiers that are
#               SEO-critical or contractually required. GSC data now flows via
#               the reader-signals export (select-articles.py --signals-file;
#               per-page impressions/CTR ride each queue entry's signals.gsc
#               block) — regenerating high-impression entries from thresholds
#               remains a follow-up; hand-curated entries stay.
#               The veto is CODE-ENFORCED: the publish job rejects a
#               retirement verdict whose page matches a no_retire (or
#               tier-1/tier-0) prefix, via
#               scripts/content-review/check-retire-veto.py — the model's
#               reading of the skill is the instruction, this file is the
#               guarantee.
#
# Matching is LONGEST PREFIX WINS (so a deeper, more specific entry overrides
# a broader one). Prefixes are repo paths, not URLs.
#
# Checklist when editing this file:
#   1. New generated/synced path under content/docs/? Add a tier-0 entry
#      (check the generator workflows in .github/workflows/ for write paths).
#   2. New top-level docs section? Add a tier entry, or accept default tier 3.
#   3. Retirement complaint about a page the team wants kept? Add
#      `no_retire: true` on the narrowest prefix that covers it.
#   4. Generated tree whose PROSE is written by a human upstream (CLI help
#      text, policy descriptions)? It is `editable: false, reviewable: true`,
#      not tier 0 — and it needs a `repos:` entry in
#      references/upstream-claims.yaml so a finding arrives with somewhere to
#      file it. Tier 0 is only for a tree whose text is machine-derived from a
#      source of truth (the SDK API reference), where "it's generated" really
#      does mean "it's correct".
#   5. Run `python3 scripts/content-review/test_select_articles.py` — it
#      validates this file parses and that each generated tree lands in the
#      lane its entry claims.

tiers:
  # -- Generated content: not editable here (generators own these trees) -----
  # The review bot must never EDIT a generated or upstream-synced page: the
  # generator overwrites it on the next run, so any hand edit is lost and the
  # spend is wasted. Whether it may READ one is a separate question, answered
  # per tree below.
  - prefix: content/docs/iac/cli/commands/
    tier: 3
    editable: false
    reviewable: true
    note: >-
      Generated by pulumi-cli-docs.yml from the cobra command definitions in
      pulumi/pulumi. The files are machine-assembled but the descriptions,
      synopses, and flag help inside them are hand-written prose that can be
      wrong exactly the way the policy-pack descriptions were (#20996) — and
      at 248 pages this is the single largest never-fact-checked tree in the
      corpus. Report-only lane: record the claim list, change nothing;
      contradictions route to pulumi/pulumi via upstream-claims.yaml.
  - prefix: content/docs/reference/pkg/
    tier: 0
    note: >-
      Auto-generated SDK API reference (regenerated on every upstream SDK
      release). Deliberately NOT reviewable, unlike the other generated trees:
      it is rendered from the machine-readable API definition, which IS the
      source of truth for what the SDK exposes. The one place "it's generated"
      really does mean "it's correct" — a claim check here would be verifying
      the schema against itself. (Its owning repo also varies per provider, so
      there is no single upstream to route a finding to.)
  - prefix: content/docs/reference/pre-built-policy-packs/
    tier: 0
    note: >-
      built at request time by _content.gotmpl from data/policy_pack_policies/,
      which update-policy-packs.yml refetches from the Pulumi Cloud API nightly.
      There are no .md files to edit; this entry should have landed with #20274
      (2026-07-16), which deleted them. NOTE the nightly claims re-verify still
      fact-checks these pages' claims and should keep doing so — the sync keeps
      them FRESH, not CORRECT, and every confirmed user-facing misstatement the
      lane has found came from this tree. Contradictions here route to
      references/upstream-claims.yaml, not to a marker. Tier 0 only keeps the
      fix lane from spending a slot on a page it cannot edit.
      NOT `reviewable: true` (#20996) for a mechanical reason rather than a
      policy one: the selector globs content/docs/**/*.md and there are no
      files here to find. Its claims are in the index only because the tree
      was reviewed the day before #20274 deleted them. Refreshing them needs
      a different intake that can render the adapter's pages first — the same
      gap reference/cloud-rest-api/ has.

  # -- Tier 1: flagship (onboarding + core concepts; implies no_retire) ------
  # Highest-value onboarding and concept surfaces; factual drift here is the
  # most damaging. The top-trafficked docs areas in the trailing-6-month
  # pageview data (fct_pageviews) are exactly these onboarding/concept paths.
  - prefix: content/docs/get-started/
    tier: 1
  - prefix: content/docs/install/
    tier: 1
  - prefix: content/docs/iac/concepts/
    tier: 1
  - prefix: content/docs/iac/get-started/
    tier: 1

  # -- Tier 2: important product areas ----------------------------------------
  # Major product surfaces with material organic traffic. iac/ is the dominant
  # docs area by a wide margin, so it carries no_retire to keep the flagship
  # product out of the retirement lane (its onboarding/concepts are tier 1).
  - prefix: content/docs/iac/
    tier: 2
    no_retire: true
  - prefix: content/docs/esc/
    tier: 2
  - prefix: content/docs/deployments/
    tier: 2
  - prefix: content/docs/administration/
    tier: 2
    note: promoted from default — high organic traffic (self-hosting, access-identity)
  - prefix: content/docs/insights/
    tier: 2
  - prefix: content/docs/idp/
    tier: 2
  - prefix: content/docs/ai/
    tier: 2

  # -- Tier 3 (default): integrations, support, and other supporting material -
  # Not product areas — unmatched paths default to tier 3. reference/ stays
  # tier 3 but is pinned no_retire below (cloud-rest-api and the pre-built
  # policy packs draw steady search traffic).

  # -- no_retire on lower tiers (SEO-critical or otherwise protected) --------
  - prefix: content/docs/reference/
    tier: 3
    no_retire: true
