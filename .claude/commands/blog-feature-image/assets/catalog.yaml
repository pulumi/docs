# Blog Feature Image Asset Catalog
# Feature image render target: 1884x1256
#
# The 1200x628 OpenGraph/social card is no longer composited here — it is
# generated on-brand at build time from the post title + the feature image
# (scripts/meta-images/blog.mjs via scripts/generate-meta-images.mjs).

feature_canvas:
  width: 1884
  height: 1256

templates:
  # -- Feature templates (1884x1256, no text) --
  - filename: feature-neo.png
    mode: feature
    type: static
    description: "AI, machine learning, Pulumi Neo (tags: ai, pulumi-neo)"

  - filename: feature-platform.png
    mode: feature
    type: static
    description: "Platform engineering, DevOps, Pulumi news and events (tags: platform-engineering, cloud-engineering, devops, pulumi-news, pulumi-events, community)"

  - filename: feature-rocket.png
    mode: feature
    type: static
    description: "Releases, new features, and announcements (tags: pulumi-releases, releases, release-notes, features)"

  - filename: feature-shield.png
    mode: feature
    type: static
    description: "Security, secrets, compliance, and policy (tags: security, secrets, esc, policy-as-code)"

  - filename: feature-lightbulb.png
    mode: feature
    type: static
    description: "Tutorials, how-tos, best practices, and guest posts (tags: aws, kubernetes, infrastructure-as-code, serverless, best-practices, continuous-delivery, containers, guest-post)"

  # -- Feature shape variants (1884x1256, outline shape with a 340x340 center
  #    clear space; dual-use: 1 phosphor icon OR 1 small logo composited) --
  - filename: feature-shape-circle.png
    mode: feature
    type: shape
    logo_slots: 1
    description: "General-purpose abstract — focus, wholeness; pick by icon silhouette fit"
    placeholders:
      - { x: 772, y: 458, width: 340, height: 340 }

  - filename: feature-shape-square.png
    mode: feature
    type: shape
    logo_slots: 1
    description: "General-purpose abstract — building blocks, components; pick by icon silhouette fit"
    placeholders:
      - { x: 772, y: 458, width: 340, height: 340 }

  - filename: feature-shape-diamond.png
    mode: feature
    type: shape
    logo_slots: 1
    description: "General-purpose abstract — decisions, data flow, networking; pick by icon silhouette fit"
    placeholders:
      - { x: 772, y: 458, width: 340, height: 340 }

  - filename: feature-shape-hexagon.png
    mode: feature
    type: shape
    logo_slots: 1
    description: "Kubernetes-adjacent topics, modules, packages, components (tags: kubernetes, containers)"
    placeholders:
      - { x: 772, y: 458, width: 340, height: 340 }

  - filename: feature-shape-lock.png
    mode: feature
    type: shape
    logo_slots: 1
    description: "Security, secrets, encryption, access control (tags: security, secrets, esc)"
    placeholders:
      - { x: 772, y: 458, width: 340, height: 340 }

  - filename: feature-shape-shield.png
    mode: feature
    type: shape
    logo_slots: 1
    description: "Security posture, compliance, policy, protection (tags: security, policy-as-code, compliance) — shape counterpart to the static feature-shield.png; prefer this variant when a topical icon or logo adds specificity"
    placeholders:
      - { x: 772, y: 458, width: 340, height: 340 }

  - filename: feature-shape-speech-bubble.png
    mode: feature
    type: shape
    logo_slots: 1
    description: "Community, Q&A, announcements-as-conversation, AI chat and agents (tags: community, ai)"
    placeholders:
      - { x: 772, y: 458, width: 340, height: 340 }

  - filename: feature-shape-sync-diamond.png
    mode: feature
    type: shape
    logo_slots: 1
    description: "CI/CD, automation, deployments, drift detection, sync (tags: continuous-delivery, deployments, automation)"
    placeholders:
      - { x: 772, y: 458, width: 340, height: 340 }

  # -- Feature logo variants (1884x1256, logos composited onto circles) --
  - filename: feature-logo-1.png
    mode: feature
    type: logo
    logo_slots: 1
    placeholders:
      - { x: 602, y: 288, width: 680, height: 680 }

  - filename: feature-logo-2.png
    mode: feature
    type: logo
    logo_slots: 2
    placeholders:
      - { x: 499, y: 432, width: 390, height: 390 }
      - { x: 992, y: 432, width: 390, height: 390 }

  - filename: feature-logo-3.png
    mode: feature
    type: logo
    logo_slots: 3
    placeholders:
      - { x: 747, y: 234, width: 390, height: 390 }
      - { x: 499, y: 630, width: 390, height: 390 }
      - { x: 993, y: 630, width: 390, height: 390 }

