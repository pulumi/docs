# Actual spell-check. Vale's built-in `spelling` extension (Hunspell, en_US),
# which is a different thing from Google.Spelling -- that rule, despite its
# name, is four tokens for British spellings and checks no misspellings at all.
# Until this rule existed, nothing in the repo did.
#
# ADVISORY for now (`level: warning`, off the `blocker:` list in
# .claude/commands/docs-review/scripts/vale-deterministic-fixes.yaml). The
# corpus is well spelled, so essentially every finding is a dictionary gap
# rather than an error, which means the false-positive rate is a function of
# how complete ignore/tech-vocabulary.txt is -- and blocker tier demands a
# near-zero rate. Promote it once the vocabulary has settled and a full-corpus
# run is quiet.
#
# Measured when this landed: the seeded list was harvested and triaged from a
# 495-file sample, where it takes 1,412 raw findings down to 1 -- and that one
# is a real typo ("conbuckettainer" in the GCP stack-outputs tutorial). On 229
# files the harvest never saw, the residual is ~2.2 findings per file, almost
# all vendor and people names (Alibaba, Bazel, Bitnami, Appium). Expect roughly
# 300 more terms to accumulate as reviews surface them; add a word when a
# finding is genuinely correct, and fix the prose when it isn't.
#
# `filters` skip code-shaped tokens that legitimately appear in prose, so they
# never need listing: camelCase, snake_case, ALLCAPS acronyms, dotted names.
extends: spelling
message: "'%s' isn't in the dictionary or styles/Pulumi/ignore/tech-vocabulary.txt. Fix the spelling, or add the term if it's genuinely correct."
link: "https://brand.pulumi.com/voice/writing-style/"
level: warning
ignore:
  - Pulumi/ignore/tech-vocabulary.txt
filters:
  - "[a-z]+[A-Z]"
  - "_"
  - "^[A-Z0-9]{2,}s?$"
  - '\.'
