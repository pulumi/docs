# Flags retired product names whose *replacement is context-dependent* — the
# dead name is always wrong, but a human (or reviewing model) has to pick the
# right current name for the sentence, so these are existence (flag-only)
# findings, never auto-substitutions. Retired names with a single fixed
# replacement (Pulumi Insights -> Pulumi Discovery, CrossGuard -> Pulumi
# Policies, ...) live in Substitutions.yml instead.
#
# This is an offline mirror of the "Retired and disallowed names" table in the
# brand guide's Names & terminology section (the source of truth; see
# styles/Pulumi/BRAND-SYNC.yaml).
#
# NO LOOKBEHINDS. Vale evaluates a token against a scoped substring, and a
# negative lookbehind at the start of that window is silently dropped, so the
# same sentence flags or doesn't depending on how much text precedes it. It is
# reproducible: with these tokens written as `(?<!VS Code )\bCopilot\b`, the
# line "GitHub Copilot works well. Microsoft Copilot exists. VS Code Copilot
# too." is clean under an 8-character H1 and flags "VS Code Copilot" under a
# 17-character one. Lookaheads are evaluated inside the window and are stable
# across the same sweep, so `Pulumi Service` below keeps its two.
#
# Token notes (case-sensitive, so the generic lowercase words never flag):
#
#   - "Pulumi Service": pre-2022 name of Pulumi Cloud, but resolves to a
#     different product in different sentences (Pulumi Cloud most often; Pulumi
#     ESC or Pulumi Deployments where the sentence is about secrets or remote
#     execution). The lookaheads exclude the plural "Pulumi Services" (the IDP
#     Services concept) and "Pulumi Service provider" — the
#     `pulumi-pulumiservice` provider still carries its historic name upstream
#     (registry package id `pulumiservice`), and renaming it is a product/IA
#     decision with URL-alias consequences, outside this lint rule's remit.
#   - "IAS": the retired Insights acronym.
#
# Intentionally NOT mirrored here (see the brand-vale-sync skill's
# "intentionally unmirrored" rule): bare "Insights" and bare "Copilot". Both
# would need a lookbehind to avoid double-flagging the "Pulumi Insights" /
# "Pulumi Copilot" that RetiredNames.yml already covers, and bare
# "Copilot" collides with the GitHub, Microsoft, and VS Code products this
# site legitimately references (content/docs/ai/skills/, the RBAC scope
# tables). Without a reliable lookbehind there is no safe regex for either, so
# they stay model-review territory rather than becoming a noisy blocker.
extends: existence
message: "'%s' is a retired product name. Choose the current name for this context — see the brand guide's Names & terminology page (retired-names table)."
link: "https://brand.pulumi.com/voice/names-and-terminology/"
level: error
ignorecase: false
tokens:
  - '\bPulumi Service\b(?!s\b)(?!\s+[Pp]rovider\b)'
  - '\bIAS\b'
