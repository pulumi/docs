# Flags retired product names whose *replacement is context-dependent* — the
# dead name is always wrong, but a human (or reviewing model) has to pick the
# right current name for the sentence, so these are existence (flag-only)
# findings, never auto-substitutions. Retired names with a single fixed
# replacement (Pulumi Insights -> Pulumi Discovery, CrossGuard -> Pulumi
# Policies, ...) live in Substitutions.yml instead.
#
# This is an offline mirror of the "Retired and disallowed names" table in the
# brand guide's Names & terminology section (the source of truth; see
# styles/Pulumi/BRAND-SYNC.yaml).
#
# Token notes (the rule is case-sensitive so bare generic words don't flag;
# character classes cover the common miscasings):
#
#   - "Pulumi Service": pre-2022 name of Pulumi Cloud, but resolves to a
#     different product in different sentences (Pulumi Cloud most often; Pulumi
#     ESC or Pulumi Deployments where the sentence is about secrets or remote
#     execution). Excludes the plural "Pulumi Services" (the IDP Services
#     concept) and "Pulumi Service provider" — the `pulumi-pulumiservice`
#     provider still carries its historic name upstream (registry package id
#     `pulumiservice`), and renaming it is a product/IA decision with URL-alias
#     consequences, outside this lint rule's remit.
#   - "Insights": retired in favor of Discovery, but bare capitalized Insights
#     needs a human eye (historical prose is allowed to stand, and the right
#     replacement may be "Discovery", "Discovery & governance", or a feature
#     name). Excludes "Pulumi Insights" and the fixed phrases ("Insights
#     account/scan/supergraph/resources") that Substitutions.yml auto-fixes,
#     so the same text is never double-flagged. Lowercase "insights" (the
#     ordinary English noun) never flags.
#   - "Copilot": retired in favor of Pulumi Neo. Excludes "Pulumi Copilot"
#     (auto-fixed by Substitutions.yml) and the unrelated GitHub/Microsoft/
#     VS Code Copilot products, which docs legitimately reference. Known
#     limitation: a bare "Copilot" in an agent list ("Cursor, Copilot,
#     Codex") means GitHub's product but still flags — the reviewing model
#     refutes it from context; the fixed lookbehinds can't.
#   - "IAS": the retired Insights acronym.
#   - "Policy Violations": the retired console page name; the page is now
#     "policy findings" (lowercase "policy violations" is fine in prose for
#     what a policy check surfaces, and stays unflagged via case sensitivity).
extends: existence
message: "'%s' is a retired product name. Choose the current name for this context — see the brand guide's Names & terminology page (retired-names table)."
link: "https://brand.pulumi.com/voice/names-and-terminology/"
level: warning
ignorecase: false
tokens:
  - '\b[Pp]ulumi [Ss]ervice\b(?!s\b)(?!\s+[Pp]rovider\b)'
  - '(?<!Pulumi )\bInsights\b(?!\s+(?:account|scan|supergraph|resources)\b)'
  - '(?<!Pulumi )(?<!GitHub )(?<!Microsoft )(?<!VS Code )\bCopilot\b'
  - '\bIAS\b'
  - '\bPolicy Violations\b'
