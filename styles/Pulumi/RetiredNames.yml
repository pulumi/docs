# Retired product names that were RENAMED — the old name is retired, and the
# brand guide's "Retired and disallowed names" table gives the new one.
#
# Advisory (`level: warning`, and deliberately NOT on the `blocker:` list in
# .claude/commands/docs-review/scripts/vale-deterministic-fixes.yaml), because
# the brand guide's own preamble carves out two cases a blanket auto-fix gets
# wrong, and both occur in this repo:
#
#   1. "Historical usage is fine. Prose that intentionally describes past
#      behavior ... is acceptable." content/case-studies/unity.md says "Pulumi
#      Neo is our AI platform engineer, replacing Pulumi Copilot with expanded
#      capabilities" — mechanically applying the swap produces "Neo ...
#      replacing Neo". The same page carries a heading anchor `{#copilot}`
#      that a rename would break.
#   2. "Some replacements can't be automated." "Insights" resolves to the
#      Discovery *product* in most sentences but to the "Discovery &
#      governance" *category* in others (its own row in the brand table), and
#      the docs IA still lives under /docs/insights/.
#
# So these need a human or a reviewing model to confirm each swap in context.
# The fix is still deterministic (the brand table names the replacement), so
# the rule stays on the `deterministic_fix:` list — review-existing-content
# applies it only after confirming the swap preserves meaning, which is
# exactly the judgment gate these rows need.
#
# Rows graduate to Substitutions.yml (error, blocker) once the repo-wide
# backlog for that name reaches zero, the way `self-managed backend` did in
# the PR that added this file. Vale-visible backlog at that time, excluding
# the content/blog and generated-CLI trees that .vale.ini exempts:
# Pulumi Insights 24, Insights scan 3, Insights account 2, Pulumi Copilot 2,
# Policy Violations 3, Insights supergraph 1, Insights resources 1.
extends: substitution
message: '''%s'' is a retired name; the brand guide replaces it with ''%s''. Confirm it fits this sentence — historical prose ("X replaced Y") and heading anchors are legitimate exceptions.'
link: "https://brand.pulumi.com/voice/names-and-terminology/"
level: warning
ignorecase: true
action:
  name: replace
swap:
  '\bPulumi Copilot\b': Pulumi Neo
  '\bPulumi Insights\b': Pulumi Discovery
  '\bInsights account\b': cloud account
  '\bInsights scan\b': Discovery scan
  '\bInsights supergraph\b': resource graph
  '\bInsights resources\b': discovered resources
  '\bPolicy Violations\b': policy findings
