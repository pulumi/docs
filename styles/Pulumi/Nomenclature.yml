# Rows are deliberately absent where a correctly-cased proper noun is followed
# by a generic lowercase noun -- "Pulumi deployments" (the deployment runs, not
# the product) and "Pulumi discovery" (the act of discovering). No regex tells
# those from the product names, and this rule blocks while naming an exact
# replacement the reviewer is asked to apply, so a wrong swap is worse than a
# missed one. (Nothing auto-applies it: `deterministic_fix` describes the fix,
# not a decision to apply it -- see vale-deterministic-fixes.yaml's header.)
#
# The same principle removes the all-lowercase form wherever it collides with a
# real CLI command group: `pulumi cloud` (pulumi cloud api), `pulumi policy`
# (12 subcommands), and `pulumi neo` (pulumi neo resume) are commands, not
# miscased product names. A subcommand allowlist can't rescue them, because the
# bare group name is just as legitimate -- "Run pulumi neo to start a session"
# and "the pulumi policy CLI commands" are both correct prose, and both were
# live false positives on shipping pages before these rows came out. Code spans
# are scoped out of Vale, but front matter isn't, and meta_desc can't use
# backticks. The PLURAL forms stay: `pulumi policies` and `pulumi deployments`
# are not commands (the commands are singular), so they're unambiguous.
extends: substitution
message: "Use Pulumi's canonical spelling: '%s' instead of '%s' (brand guide: Names & terminology)."
link: "https://brand.pulumi.com/voice/names-and-terminology/"
level: error
ignorecase: false
action:
  name: replace
swap:
  '\bpulumi esc\b': Pulumi ESC
  '\bPulumi Esc\b': Pulumi ESC
  '\bpulumi iac\b': Pulumi IaC
  '\bPulumi Iac\b': Pulumi IaC
  '\bPulumi IAC\b': Pulumi IaC
  '\bpulumi idp\b': Pulumi IDP
  '\bPulumi Idp\b': Pulumi IDP
  '\bpulumi discovery\b': Pulumi Discovery
  '\bpulumi policies\b': Pulumi Policies
  '\bPulumi neo\b': Pulumi Neo
  '\bpulumi kubernetes operator\b': Pulumi Kubernetes Operator
  '\bPulumi kubernetes operator\b': Pulumi Kubernetes Operator
  '\bPulumi Kubernetes operator\b': Pulumi Kubernetes Operator
  '\bpulumi deployments\b': Pulumi Deployments
  '\bpulumi cli\b': Pulumi CLI
  '\bPulumi Cli\b': Pulumi CLI
  '\bpulumi sdk\b': Pulumi SDK
  '\bPulumi Sdk\b': Pulumi SDK
  '\bPulumi Cloud Console\b': Pulumi Cloud console
  '\bPulumi Console\b': Pulumi Cloud console
  '\bPulumi UI\b': Pulumi Cloud console
