languageCode: en-us
title: Pulumi - Infrastructure as Code in Any Programming Language

refLinksErrorLevel: ERROR
security:
  funcs:
    getenv:
      - ASSET_BUNDLE_ID
      - CSS_BUNDLE_ID
      - GITHUB_TOKEN
      - ALGOLIA_APP_ID
      - ALGOLIA_APP_SEARCH_KEY

sectionPagesMenu: main
pygmentsCodeFences: true
pygmentsUseClasses: true

# We always generate the robots.txt file. But based on the environment
# built, it may disallow crawling.
enableRobotsTXT: true

# Enabling Git info allows us to have Hugo automatically set the lastmod date in sitemap
# XML with the date the file was last changed (according to Git).
enableGitInfo: true

# Some of our API docs pages are very large with many shortcodes, which can take
# a while to generate (especially in CI), so we raise the limit from the default
# 10 seconds to avoid timeouts when generating the site.
timeout: 300000

# Exclude static/programs from Hugo's file watcher. It's ~15 MiB / 2000+ files
# of code samples maintained by codegen, not during normal authoring — watching
# them just slows `hugo server` down. The files are still served; only the
# watch is disabled.
#
# Declaring a mount that overlaps `static` disables Hugo's default
# `static → static` mount, so we re-declare it. Other defaults (archetypes,
# assets, content, data, i18n, layouts, etc.) are still auto-added.
module:
  mounts:
    - source: static
      target: static
    - source: static/programs
      target: static/programs
      disableWatch: true

outputFormats:
  rss:
    baseName: rss
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    permalinkable: false
  markdown:
    mediaType: "text/markdown"
    baseName: "index"
    isPlainText: true
    notAlternative: true
  llmsitemap:
    mediaType: "application/json"
    baseName: "llm-sitemap"
    isPlainText: true
    notAlternative: true
  # Bare list-rows HTML fragment for a taxonomy term, fetched by the homepage
  # category filter (theme/src/ts/blog-list.ts). Rendered by
  # layouts/_default/term.rows.html at /blog/category/<id>/rows.html. Not an
  # alternate representation, so it stays out of <head> alternates and sitemap.
  rows:
    mediaType: "text/html"
    baseName: "rows"
    isHTML: true
    notAlternative: true

# We set the outputs explicitly to just "HTML" as otherwise they default to both
# "HTML" and "RSS", and we only want to generate RSS for the blog section -- not
# all sections/taxonomies. We enable RSS as an output for the blog section alone
# in the front matter of content/blog/_index.md and have a custom RSS template
# in layouts/blog/rss.xml.
outputs:
  home:
    - HTML
    - JSON
    - llms
    - markdown
  section:
    - HTML
  page:
    - HTML
  # Taxonomy term pages also emit a "rows" fragment (layouts/_default/term.rows.html).
  # Only the blog category filter consumes it; for non-blog terms the fragment is
  # empty (the template filters to the blog section).
  # RSS gives every blog term page (category / tag / author / series) its own feed
  # at <term-url>rss.xml, rendered by layouts/_default/term.rss.xml.
  term:
    - HTML
    - rows
    - RSS

cascade:
  - _target:
      kind: term
      path: /industry/**
    outputs:
      - HTML
  - _target:
      kind: taxonomy
      path: /industry/**
    outputs:
      - HTML
  - _target:
      kind: taxonomy
      path: /industry
    outputs:
      - HTML

taxonomies:
  tag: tags
  author: authors
  # Plural is intentionally "category" (not "categories") so Hugo reads the
  # existing scalar `category:` front matter on blog posts. Hugo casts the
  # scalar value to a one-term list. See layouts/taxonomy/category.html and
  # data/blog_categories.yaml (single source of truth for term titles/desc).
  category: category
  # Like category above, plural is "series" (not "serieses") so Hugo reads the
  # existing scalar `series:` front matter and casts it to a one-term list. Term
  # pages land at /blog/series/:slug/. See layouts/taxonomy/series.html and
  # data/blog_series.yml (single source of truth for series titles/desc).
  series: series
  # Plural is intentionally "industry" (not "industries") so Hugo reads the
  # scalar `industry:` front matter on case studies and casts it to a one-term
  # list. Term pages land at /case-studies/industry/:slug/. See
  # layouts/taxonomy/industry.html and data/case_study_industries.yaml (single
  # source of truth for term titles/desc). Non-blog: no RSS (scoped above).
  industry: industry

permalinks:
  term:
    authors: /blog/author/:slug/
    tags: /blog/tag/:slug/
    category: /blog/category/:slug/
    series: /blog/series/:slug/
    industry: /case-studies/industry/:slug/
  # The category/series taxonomy LIST pages (the directories rendered by
  # layouts/taxonomy/category.terms.html and layouts/taxonomy/series.terms.html).
  # Without these they would sit at Hugo's default /category/ and /series/,
  # leaving /blog/category/ and /blog/series/ 404s even though every term page
  # lives beneath them.
  taxonomy:
    category: /blog/category/
    series: /blog/series/
    industry: /case-studies/industry/

# Built-in Related Content, used by layouts/partials/blog/related-posts.html to
# top up a post's related list. Tags dominate; category and recency break ties.
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: category
      weight: 40
    - name: date
      weight: 10

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: false
      strikethrough: true
      table: true
      taskList: true
      typographer: true
    parser:
      autoHeadingID: true
      autoHeadingIDType: "github"
      attribute:
        block: true
        title: true
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

params:
    # CTA configuration
    cta:
        primary:
            label: "Get started"
            label_short: "Sign up"
            href: "https://app.pulumi.com/signup"
        secondary:
            label: "Contact us"
            href: "/contact/?form=sales"

    canonicalURL: https://www.pulumi.com
    contentRepositoryURL: https://github.com/pulumi/docs
    contentRepositoryBaseBranch: master
    registryRepositoryURL: https://github.com/pulumi/registry
    registryRepositoryBaseBranch: master
    meta_desc: |
        Pulumi's open source infrastructure as code SDK enables you to create, deploy,
        and manage infrastructure on any cloud, using your favorite languages.

    # Schema.org configuration
    schema:
        # Pulumi CLI version - dynamically updated by CI/CD
        pulumi_version: "3.198.0"

        # Performance optimization
        max_content_scan_length: 5000

minify:
  tdewolff:
    html:
      keepQuotes: true
