name: "Scheduled jobs: Re-verify volatile claims"

# Nightly re-verification of VOLATILE claims (version pins, prices, limits)
# straight from the S3 claims index that content-review-article.yml persists —
# no page diff, no re-extraction, one cheap verifier call per entity
# (pulumi/docs#20078 §4.1). Entities that re-verify contradicted get a
# `stale_claims` marker written into their pages' ledger objects; the daily
# content-review dispatcher's selector boosts marked pages to the front of
# the queue, and the normal per-article worker fixes the page through the
# existing PR machinery. This job never edits content and never opens PRs —
# it only checks facts and marks pages as due.
#
# SINGLE SWITCH (default-on) — the CLAIMS_REVERIFY_COUNT repo variable is both
# the on/off and the cadence knob (same pattern as CONTENT_REVIEW_COUNT):
#   unset -> on, 25 entities/night (the default)
#   '0'   -> off: the whole job is skipped (no runner, no spend)
#   'N'   -> on, N entities/night
# The sweep is a stateless day rotation over the ELIGIBLE entity set (volatile,
# minus entities already carrying a stale marker or superseded by a newer
# review), so all of it is covered every ceil(N_eligible/count) nights
# regardless of the knob. The rotation slices with a stride, not a contiguous
# window: a contiguous last chunk is whatever the remainder happens to be, so a
# 51-entity pool at count=25 split 25/25/1 and one night in three checked a
# single entity. That is what happened on 2026-08-19, and the all-inconclusive
# n=1 then degraded the reverify health signal for the whole lane. Chunk sizes
# now differ by at most one, and `meta.n_eligible` / `meta.n_marked` in the
# report say which pool the rotation divided, so a short night is diagnosable
# from the artifact alone.
#
# The job gate wraps the variable in format('{0}', ...) — do not "simplify" it
# back to a bare `vars.X != '0'`. An unset variable is null, and GitHub coerces
# a Null-vs-String comparison to numbers (null -> 0, '0' -> 0), so the bare
# form evaluates 0 != 0 = FALSE and unset silently means OFF, inverting the
# default documented above. That bug kept this lane from ever running on
# schedule — and because the health signal below only reports from a run that
# actually happened, a never-started lane never tripped it either.
#
# TURNED ON 2026-08-11 with `CLAIMS_REVERIFY_COUNT` set explicitly to '25' in
# pulumi/docs, so the first live run is a recorded decision rather than an
# implicit default. At the time there were 63 volatile entities across 86
# claim snapshots — a full sweep every 3 nights.
#
# The first two live sweeps (Aug 11-12, 50 entities, 0 stale) confirmed both
# of the things that warning called for; pulumi/docs#20851 fixed them:
#   * 48 of 50 entities were typed `numerical`, and many were counts of the
#     page's own example output ("the example update creates 3 resources")
#     rather than version pins or limits. entity_key.py now excludes
#     self-describing numerical claims from `volatile`, and this lane
#     re-derives the flag rather than trusting what the snapshot stored.
#   * 22 of 35 `verified` verdicts cited only Pulumi's own published docs —
#     16 of them the published copy of the very page making the claim. Those
#     are demoted to `unverifiable` now: the site is this repo rendered, so
#     such a check can never detect drift. Expect `fresh` to read far lower
#     than it did on those two nights; the difference was never real.
#
# DEGRADATION HEALTH: this lane only Slacks when it finds STALE entities, so a
# dead lane (claims index gone, API key missing, every check inconclusive)
# would otherwise look identical to a healthy quiet one. The health steps at
# the end feed a `reverify` signal — read from the report's meta block — into
# the same signal-health state the review-existing-content dispatcher uses
# (ledger bucket, health/ prefix), alerting #docs-ops after a week of
# continuous degradation. The two workflows share that state object
# read-modify-write; their schedules (7:00 vs ~14:00 UTC) don't overlap, and
# each observes disjoint signals, so last-writer-wins is safe in practice —
# an accepted, documented race, same as signal-health.py's own.

on:
  schedule:
    # Daily at 7:00AM UTC — hours before the 2:00PM content-review dispatcher,
    # so tonight's stale markers are in the ledger before today's selection.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of volatile entities to re-verify'
        required: false
        default: '25'
      dry_run:
        description: 'No API calls, no marker uploads — plumbing check only'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write # Required for ESC OIDC auth + AWS OIDC role

jobs:
  # Same fail-open holiday gate as review-existing-content.yml: variable
  # unset, feed failure, or parse error all yield is_holiday=false.
  holiday-check:
    name: Company-holiday check
    runs-on: ubuntu-latest
    outputs:
      is_holiday: ${{ steps.check.outputs.is_holiday }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          ICS_URL: ${{ vars.BAMBOOHR_HOLIDAY_ICS_URL }}
        run: |
          if [ -z "$ICS_URL" ]; then
            echo "BAMBOOHR_HOLIDAY_ICS_URL not set; not skipping for holidays"
            echo "is_holiday=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! curl -fsSL --max-time 20 "$ICS_URL" -o holidays.ics; then
            echo "::warning::holiday feed unavailable (404/fetch failure); failing open (re-verify will run)"
            echo "is_holiday=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if python3 scripts/content-review/is-holiday.py --ics holidays.ics --tz America/Chicago; then
            echo "is_holiday=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_holiday=false" >> "$GITHUB_OUTPUT"
          fi

  reverify:
    name: Re-verify volatile claims
    needs: holiday-check
    runs-on: ubuntu-latest
    # PULUMI_STACK_NAME is an environment-scoped variable, so the job must
    # select the environment to resolve the ledger bucket from stack outputs.
    environment: production
    # Hard cost ceiling: N short verifier calls fit well inside this.
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (format('{0}', vars.CLAIMS_REVERIFY_COUNT) != '0' && needs.holiday-check.outputs.is_holiday != 'true')
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v3
      # Shallow checkout is fine: the verifier's read_file only needs the
      # current tree, and this job reads no git history.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Both S3 prefixes (claims index + review ledger) live in the ledger
      # bucket, resolved from our Pulumi stack output — never a hand-maintained
      # variable. Every S3 step degrades gracefully: with no bucket the script
      # sees an empty claims dir and exits with an empty report.
      - name: Configure AWS credentials
        id: aws-creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::388588623842:role/ContinuousDelivery
          role-session-name: claims-reverify
          aws-region: us-west-2
      - name: Install Pulumi CLI
        uses: pulumi/actions@v7
      - name: Resolve ledger bucket
        id: ledger-bucket
        continue-on-error: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_ACCESS_TOKEN }}
        run: |
          BUCKET=$(pulumi -C infrastructure stack output contentReviewLedgerBucketName \
            --stack "${{ vars.PULUMI_STACK_NAME }}" 2>/dev/null || true)
          if [ -n "$BUCKET" ]; then
            echo "ledger_uri=s3://$BUCKET/ledger/" >> "$GITHUB_OUTPUT"
            echo "claims_uri=s3://$BUCKET/claims/" >> "$GITHUB_OUTPUT"
            # Degradation-health state lives in the same bucket, own prefix
            # (shared with review-existing-content.yml).
            echo "health_uri=s3://$BUCKET/health/" >> "$GITHUB_OUTPUT"
          else
            echo "ledger bucket output unavailable; nothing to re-verify"
          fi

      - name: Fetch claims index and review ledger from S3
        if: steps.ledger-bucket.outputs.claims_uri != ''
        continue-on-error: true
        run: |
          mkdir -p .claims-cache .ledger-cache
          aws s3 sync "${{ steps.ledger-bucket.outputs.claims_uri }}" .claims-cache/ --quiet \
            || echo "claims index unavailable; nothing to re-verify"
          aws s3 sync "${{ steps.ledger-bucket.outputs.ledger_uri }}" .ledger-cache/ --quiet \
            || echo "review ledger unavailable; markers will create minimal entries"
          echo "claims snapshots: $(ls .claims-cache | wc -l), ledger entries: $(ls .ledger-cache | wc -l)"

      # One verifier call per entity, deduped across pages. Stale verdicts are
      # written back to the ledger as stale_claims markers (uploaded object by
      # object). GH_TOKEN feeds the verifier's gh_query lane.
      - name: Re-verify volatile entities
        id: reverify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTENT_REVIEW_LEDGER_URI: ${{ steps.ledger-bucket.outputs.ledger_uri }}
        run: |
          ARGS=(--claims-dir .claims-cache --ledger-dir .ledger-cache
                --count "${{ github.event.inputs.count || vars.CLAIMS_REVERIFY_COUNT || '25' }}"
                --out .claims-reverify-report.json)
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python3 scripts/content-review/reverify-claims.py "${ARGS[@]}"
          echo "--- report ---"
          cat .claims-reverify-report.json

      # The report is the lane's only durable evidence: the run log masks every
      # occurrence of the org name (so source URLs read as `www.***.com`) and
      # ages out with the run. Uploaded unconditionally — a run worth debugging
      # is usually one where the verify step failed.
      - name: Upload re-verify report
        if: always() && hashFiles('.claims-reverify-report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: claims-reverify-report
          path: .claims-reverify-report.json
          # Dotfile: upload-artifact excludes hidden files unless told
          # otherwise, and hashFiles() has no such exclusion — so without this
          # the step runs and uploads nothing, with only a warning annotation.
          # That's exactly what happened on every run before 2026-08. The
          # hashFiles guard above covers the legitimately-absent report (job
          # died before the write), so a no-files result here can only be a
          # regression of the hidden-file kind: fail loudly.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      # Findings on GENERATED pages (no markdown source, so no page to mark,
      # boost, or fix here) get their own line, because the stale summary below
      # promises a content-review sweep that cannot happen for them. Fires only
      # on a change: a finding nobody has filed upstream yet, or one that has
      # started verifying clean because the upstream fix landed. A known,
      # still-contradicted finding stays in the report and says nothing here —
      # see references/upstream-claims.yaml.
      - name: Post upstream-findings change to Slack
        if: steps.reverify.outputs.has_upstream_news == 'true'
        env:
          SLACK_ACCESS_TOKEN: ${{ steps.esc-secrets.outputs.SLACK_ACCESS_TOKEN }}
        run: |
          TEXT=$(jq -r --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '
            (if (.meta.n_upstream_new // 0) > 0 then
               "Nightly claims re-verify: \(.meta.n_upstream_new) new contradicted claim(s) with no fixable page — "
               + "`generated` needs an upstream issue; `missing` means the claims index outlived the page:\n"
               + ([.meta.upstream_entities[] | select(.new)
                   | "  • [\(.reason // "?")] \(.entity_key)  (\(.pages[0]))"
                     + (if .file_issue_url then "\n      <\(.file_issue_url)|file it upstream>" else "" end)]
                  | join("\n")) + "\n"
             else "" end)
            + (if (.meta.n_upstream_resolved // 0) > 0 then
               "Nightly claims re-verify: \(.meta.n_upstream_resolved) upstream finding(s) now verify clean — "
               + "the fix landed. Retire their entries from upstream-claims.yaml:\n"
               + ([.meta.upstream_resolved_entities[] | "  • \(.)"] | join("\n")) + "\n"
             else "" end)
            + "<\($run)|Run log>"
          ' .claims-reverify-report.json)
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_ACCESS_TOKEN}" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "$(jq -n --arg ch "#docs-ops" --arg txt "$TEXT" \
              '{channel: $ch, text: $txt, unfurl_links: false}')"

      # Counts only + a run link — the evidence lives in the report artifact
      # and the ledger markers; the fix arrives as a normal content-review PR.
      - name: Post stale summary to Slack
        if: steps.reverify.outputs.has_stale == 'true'
        env:
          SLACK_ACCESS_TOKEN: ${{ steps.esc-secrets.outputs.SLACK_ACCESS_TOKEN }}
        run: |
          TEXT=$(jq -r --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '
            "Nightly claims re-verify: \(.meta.n_stale) of \(.meta.n_checked) checked volatile entities are stale. " +
            "Affected pages are boosted into the next content-review sweep. <\($run)|Run log>"
          ' .claims-reverify-report.json)
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_ACCESS_TOKEN}" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "$(jq -n --arg ch "#docs-ops" --arg txt "$TEXT" \
              '{channel: $ch, text: $txt, unfurl_links: false}')"

      # --- Degradation-health lane (see header comment). Mirrors the four
      # fail-open steps in review-existing-content.yml, contributing only the
      # `reverify` signal — the other signals' entries are left untouched by
      # design (signal-health.py treats absent observations as no evidence).
      # workflow_dispatch runs are log-only: state computed and printed, never
      # persisted, Slack never posted.
      - name: Fetch health state from S3
        if: always() && steps.ledger-bucket.outputs.health_uri != ''
        continue-on-error: true
        run: |
          aws s3 cp "${{ steps.ledger-bucket.outputs.health_uri }}state.json" .health-state.json --quiet \
            || echo "no prior health state (first run or S3 unavailable)"
      - name: Record degradation signals
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/content-review/signal-health.py \
            --state .health-state.json \
            --reverify-report .claims-reverify-report.json \
            --alert-out .health-alert.txt \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "--- health state ---"
          cat .health-state.json
      # Post before persisting: a job that dies between the two steps then
      # re-alerts next run (a harmless duplicate) instead of never alerting.
      - name: Post degradation alert to Slack
        if: always() && github.event_name == 'schedule' && hashFiles('.health-alert.txt') != ''
        continue-on-error: true
        env:
          SLACK_ACCESS_TOKEN: ${{ steps.esc-secrets.outputs.SLACK_ACCESS_TOKEN }}
        run: |
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_ACCESS_TOKEN}" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "$(jq -n --arg ch "#docs-ops" --rawfile txt .health-alert.txt \
              '{channel: $ch, text: $txt, unfurl_links: false}')"
      - name: Persist health state to S3
        if: always() && github.event_name == 'schedule' && steps.ledger-bucket.outputs.health_uri != ''
        continue-on-error: true
        run: |
          aws s3 cp .health-state.json "${{ steps.ledger-bucket.outputs.health_uri }}state.json" --quiet

env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-docs
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false
