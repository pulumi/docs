name: "Scheduled jobs: Bucket cleanup"
on:
  schedule:
    # * is a special character in YAML so you have to quote this string.
    # Run every day at 3:00PM UTC.
    - cron: '0 15 * * *'
permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
jobs:
  all:
    env:
      GOPATH: ${{ github.workspace }}/go
    name: Bucket cleanup
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v3
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::388588623842:role/ContinuousDelivery
          role-session-name: docs-cleanup
          role-duration-seconds: 7200
          aws-region: us-west-2

      - name: Install s5cmd v2.3.0 for fast S3 deletes
        run: |
          S5CMD_VERSION="2.3.0"
          S5CMD_SHA256="de0fdbfa3aceae55e069ba81a0fc17b2026567637603734a387b2fca06c299b4"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
            --retry-max-time 300 --connect-timeout 10 --max-time 120 \
            -o /tmp/s5cmd.tar.gz "https://github.com/peak/s5cmd/releases/download/v${S5CMD_VERSION}/s5cmd_${S5CMD_VERSION}_Linux-64bit.tar.gz"
          echo "${S5CMD_SHA256}  /tmp/s5cmd.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin s5cmd -f /tmp/s5cmd.tar.gz
          rm /tmp/s5cmd.tar.gz

      - name: Run make ci_bucket_cleanup
        run: make ci_bucket_cleanup
        env:
            PULUMI_ACCESS_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_ACCESS_TOKEN }}
            PULUMI_STACK_NAME: ${{ vars.PULUMI_STACK_NAME }}
            SLACK_ACCESS_TOKEN: ${{ steps.esc-secrets.outputs.SLACK_ACCESS_TOKEN }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            DEPLOYMENT_ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT }}
            WEBSITE_URL: ${{ vars.WEBSITE_URL }}
env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-docs
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false
