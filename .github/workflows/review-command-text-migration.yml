name: Review command text migration (one-off)

# One-off companion to pulumi/docs#22277, which retired the `@claude …
# #update-review` / `#new-review` shapes and `sentinel:oversized-ack` in
# favor of slash commands. The review cards, Sentinel status, and notices
# already on open PRs still teach the old shapes; this rewrites that text in
# place with scripts/review-v3/migrate-command-text.py. No model runs and no
# review is redone: only the instruction text changes (see the script's
# header for exactly what it touches).
#
# Run it after #22277 merges, dry run first: the job summary shows every
# edit as a diff and lists anything it couldn't rewrite. Then run again with
# `apply` checked. The edits are made with GITHUB_TOKEN, so they come from
# github-actions[bot] (the account that wrote the cards) and can't trigger
# any workflow. Running it twice changes nothing. Delete this workflow and
# the script once it has run.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the edits (unchecked = dry run: report only)'
        required: false
        type: boolean
        default: false
      prs:
        description: 'Space-separated PR numbers to limit to (empty = every open PR)'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout review-v3 scripts (default branch, sparse)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: scripts/review-v3
          sparse-checkout-cone-mode: false

      - name: Migrate review command text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          APPLY: ${{ inputs.apply }}
          PRS: ${{ inputs.prs }}
        run: |
          args=(--repo "$REPO" --report "$GITHUB_STEP_SUMMARY")
          for n in $PRS; do
            [[ "$n" =~ ^[0-9]+$ ]] || { echo "::error::not a PR number: $n"; exit 2; }
            args+=(--pr "$n")
          done
          if [ "$APPLY" = "true" ]; then
            args+=(--apply)
          fi
          python3 scripts/review-v3/migrate-command-text.py "${args[@]}"
