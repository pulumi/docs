name: Pre-merge Review (new-review)

# Power-user "regenerate from scratch" path. Dispatched by the explicit
# hashtag `#new-review` on an `@claude` mention — typically used to
# recover from a corrupted or manually-deleted pinned review.
#
# This workflow is a lightweight dispatcher: it doesn't invoke the
# claude-code-action itself. Instead it clears any existing pinned
# review comments and then dispatches `claude-code-review.yml` via
# `gh workflow run` with `force=true`, so the existing initial-review
# pipeline (Opus on ci.md) handles the actual work. Single source of
# truth for "initial review" stays in claude-code-review.yml.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-new:
    # Trigger requires:
    #   1. `@claude` mention.
    #   2. `#new-review` hashtag (precedence rule: if both #update-review
    #      and #new-review appear, #new-review wins; claude-update.yml's
    #      filter excludes itself in that case).
    #   3. Author is not claude[bot] itself.
    # The `issues` event is intentionally excluded — #new-review only
    # makes sense on a PR (there's no pinned review on an issue).
    if: |
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(github.event.comment.body, '#new-review') && github.event.comment.user.login != 'claude[bot]') ||
       (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(github.event.comment.body, '#new-review') && github.event.comment.user.login != 'claude[bot]') ||
       (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(github.event.review.body, '#new-review') && github.event.review.user.login != 'claude[bot]'))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: write # Required to dispatch claude-code-review.yml.
    steps:
      # The job-level `if:` is a substring match; a comment that quotes
      # `@claude … #new-review` in backticks or a blockquote must not wipe
      # the review and regenerate it. Same gate as claude-update.yml: the
      # script comes from the default branch, the body from an env var.
      - name: Checkout mention gate (default branch, sparse)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          path: .mention-gate
          sparse-checkout: .claude/commands/docs-review/scripts/mention-gate.py
          sparse-checkout-cone-mode: false

      - name: Mention gate (a quoted protocol is not a request)
        id: mention-gate
        env:
          BODY: ${{ github.event.comment.body || github.event.review.body }}
        run: |
          python3 .mention-gate/.claude/commands/docs-review/scripts/mention-gate.py check \
            --hashtag new-review --body-env BODY | tee -a "$GITHUB_OUTPUT"

      # ESC runs before checkout so the bot token can authenticate the
      # checkout. claude-new.yml doesn't push today (it just clears the
      # pinned comment and dispatches claude-code-review.yml), but kept
      # consistent with the other claude-*.yml workflows in case a future
      # change adds a push path here.
      - name: Fetch secrets from ESC
        id: esc-secrets
        if: steps.mention-gate.outputs.fire == 'true'
        uses: pulumi/esc-action@v3

      - name: Checkout repository
        if: steps.mention-gate.outputs.fire == 'true'
        uses: actions/checkout@v7
        with:
          token: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
          fetch-depth: 1

      - name: Check repository write access
        id: check-access
        if: steps.mention-gate.outputs.fire == 'true'
        run: |
          REPO_FULL="${{ github.repository }}"

          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            AUTHOR="${{ github.event.comment.user.login }}"
          elif [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            AUTHOR="${{ github.event.comment.user.login }}"
          elif [ "${{ github.event_name }}" = "pull_request_review" ]; then
            AUTHOR="${{ github.event.review.user.login }}"
          else
            AUTHOR="unknown"
          fi

          echo "author=$AUTHOR" >> $GITHUB_OUTPUT

          # GitHub App bots are not collaborators, so the permission API
          # below has nothing to say about them. This list was missing here
          # while claude-update.yml / claude-code-review.yml / claude-triage.yml
          # all carried it, so every `@claude #new-review` workprentice posted
          # ended in a green run that did nothing (pulumi/docs#21936, run
          # 36421951663). Keep it identical to the other three —
          # test_workflow_sanity.py fails when the four lists drift.
          if [[ "$AUTHOR" == "github-copilot[bot]" || "$AUTHOR" == "eon-pulumi-agent[bot]" \
             || "$AUTHOR" == "workprentice[bot]" || "$AUTHOR" == "app/workprentice" ]]; then
            echo "has_write_access=true" >> $GITHUB_OUTPUT
            echo "✓ Bot $AUTHOR is whitelisted for review regeneration"
            exit 0
          fi

          # `gh api`, not curl: an unquoted `[bot]` in a curl URL is a glob
          # range, so curl failed outright and the permission read as empty.
          PERMISSION=$(GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh api \
            "repos/$REPO_FULL/collaborators/$AUTHOR/permission" \
            --jq '.permission // "none"' 2>/dev/null || echo none)
          if [[ "$PERMISSION" == "admin" || "$PERMISSION" == "write" ]]; then
            echo "has_write_access=true" >> $GITHUB_OUTPUT
            echo "✓ User $AUTHOR has $PERMISSION access to $REPO_FULL"
          else
            echo "has_write_access=false" >> $GITHUB_OUTPUT
            echo "✗ User $AUTHOR has $PERMISSION access to $REPO_FULL (insufficient permissions)"
          fi

      # A declined request used to end in a green run with nothing on the PR,
      # which reads exactly like a request that is still running. Say so.
      - name: Tell the requester the request was declined
        if: steps.mention-gate.outputs.fire == 'true' && steps.check-access.outputs.has_write_access != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ steps.check-access.outputs.author }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          [ -n "$PR" ] || exit 0
          BODY=$(printf '🤖 @%s — `#new-review` needs write access to this repository, so no review was started. A maintainer can comment `@claude #new-review` instead.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$AUTHOR")
          gh api "repos/${{ github.repository }}/issues/$PR/comments" -f body="$BODY" >/dev/null

      - name: Resolve PR number
        id: pr-context
        if: steps.check-access.outputs.has_write_access == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `issues` events were filtered out at the workflow level;
          # only PR-bearing events reach this step.
          case "${{ github.event_name }}" in
            issue_comment)
              PR_NUMBER="${{ github.event.issue.number }}"
              ;;
            pull_request_review_comment|pull_request_review)
              PR_NUMBER="${{ github.event.pull_request.number }}"
              ;;
            *)
              PR_NUMBER=""
              ;;
          esac
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          # Resolve the PR head SHA so we can pass it through to the
          # dispatched workflow_dispatch -- without it, that workflow's
          # checkout has no SHA to pin to and falls back to base.
          if [ -n "$PR_NUMBER" ]; then
            HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

      # Read the high-water mark of the review about to be cleared, so the
      # regenerated one continues its finding ids instead of reusing F1..Fn
      # for different findings (#21798). Best-effort: 0 means "unknown".
      - name: Read the cleared review's finding high-water mark
        id: prior-hw
        if: |
          steps.check-access.outputs.has_write_access == 'true' &&
          steps.pr-context.outputs.pr_number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HW=0
          CID=$(bash .claude/commands/docs-review/scripts/pinned-comment.sh find \
            --pr "${{ steps.pr-context.outputs.pr_number }}" --repo "${{ github.repository }}" --role author 2>/dev/null || true)
          if [ -n "$CID" ] && [ -f scripts/review-v3/review_state.py ]; then
            HW=$(gh api "repos/${{ github.repository }}/issues/comments/$CID" --jq .body \
              | python3 scripts/review-v3/review_state.py high-water 2>/dev/null || echo 0)
          fi
          # No card (an earlier forced run cleared it, then errored): its
          # failure notice carries the mark. Failure notices only: other bot
          # comments (cards, triage prose) can quote PR-derived text.
          MARK=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ steps.pr-context.outputs.pr_number }}/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- CLAUDE_PROGRESS -->")) | .body' 2>/dev/null \
            | python3 scripts/review-v3/review_state.py high-water-marker 2>/dev/null || echo 0)
          [[ "$HW" =~ ^[0-9]+$ ]] || HW=0
          [[ "$MARK" =~ ^[0-9]+$ ]] && (( MARK > HW )) && HW=$MARK
          echo "value=${HW:-0}" >> "$GITHUB_OUTPUT"

      # Delete every existing CLAUDE_REVIEW comment (1/M and tail) so
      # the dispatched review starts from a blank slate. The `clear`
      # subcommand is the only path that bypasses pinned-comment.sh's
      # 1/M-sacrosanct rule — explicit regenerate-from-scratch use only.
      - name: Clear existing pinned review comments
        if: |
          steps.check-access.outputs.has_write_access == 'true' &&
          steps.pr-context.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .claude/commands/docs-review/scripts/pinned-comment.sh \
            clear --pr "${{ steps.pr-context.outputs.pr_number }}" \
            --repo "${{ github.repository }}" || true

      # Acknowledge the request so the user sees the dispatch fired: a 👀
      # on the #new-review comment (ack-request.sh --start). The dispatched
      # claude-code-review.yml run keeps it (re-adding it is a no-op) and
      # swaps it for 🚀 once the cards land, or clears it and posts the
      # error — so a successful regenerate leaves no bot comment on the
      # timeline. A plain-text confirmation comment is the fallback when
      # there's nothing to react to (a review-body mention) or the reaction
      # fails; its ID travels as dispatcher_comment_id so the dispatched
      # run deletes it on completion. It stays plain text (no
      # CLAUDE_PROGRESS marker) because the dispatched run may post its own
      # spinner, and two competing CLAUDE_PROGRESS comments would confuse.
      # If the post fails the ID falls through empty and the cleanup
      # branches no-op cleanly.
      - name: Post confirmation
        id: post-confirmation
        if: |
          steps.check-access.outputs.has_write_access == 'true' &&
          steps.pr-context.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ steps.check-access.outputs.author }}
          PR: ${{ steps.pr-context.outputs.pr_number }}
          REPO: ${{ github.repository }}
          ACK_TARGET: ${{ github.event_name == 'issue_comment' && format('issues/comments/{0}', github.event.comment.id) || github.event_name == 'pull_request_review_comment' && format('pulls/comments/{0}', github.event.comment.id) || '' }}
        run: |
          ACK=.claude/commands/docs-review/scripts/ack-request.sh
          if [ -f "$ACK" ] && bash "$ACK" --start --pr "$PR" --repo "$REPO" --target "$ACK_TARGET"; then
            echo "comment_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BODY=$(printf '🤖 @%s — pinned review cleared; regenerating from scratch.' "$AUTHOR")
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR/comments" \
            -f body="$BODY" --jq '.id' || echo "")
          echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"

      # Dispatch claude-code-review.yml with force=true so it bypasses
      # trivial / frontmatter-only / draft / bot-author skip-reason
      # heuristics — explicit user request overrides the auto-skip.
      # workflow_dispatch fires the "claude-review" job in
      # claude-code-review.yml; the existing PR-context resolution,
      # Vale, prompt, posting, and post-run labels all reuse.
      # Dispatch with GITHUB_TOKEN — the dispatched run's actor becomes
      # github-actions[bot] (type=Bot). claude-code-action@v1 rejects
      # Bot actors by default; claude-code-review.yml opts in via
      # `allowed_bots: github-actions[bot]` on the action step.
      # Previously dispatched with PULUMI_BOT_TOKEN to get a User actor;
      # that path burned pulumi-bot's shared 5K/hr rate-limit bucket
      # whenever a user fired many #new-reviews in a row.
      - name: Dispatch claude-code-review.yml
        if: |
          steps.check-access.outputs.has_write_access == 'true' &&
          steps.pr-context.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run claude-code-review.yml \
            --repo "${{ github.repository }}" \
            -f pr_number="${{ steps.pr-context.outputs.pr_number }}" \
            -f head_sha="${{ steps.pr-context.outputs.head_sha }}" \
            -f force=true \
            -f dispatcher_comment_id="${{ steps.post-confirmation.outputs.comment_id }}" \
            -f mention_author="${{ steps.check-access.outputs.author }}" \
            -f prior_high_water="${{ steps.prior-hw.outputs.value || '0' }}" \
            -f ack_target="${{ github.event_name == 'issue_comment' && format('issues/comments/{0}', github.event.comment.id) || github.event_name == 'pull_request_review_comment' && format('pulls/comments/{0}', github.event.comment.id) || '' }}"

env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-docs
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false
