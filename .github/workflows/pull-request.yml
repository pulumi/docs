name: Pull Request
on:
  pull_request:
    branches:
      - master
      - 'release/**'
permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
      pull-requests: read # This is required for the Lighthouse job's changed-files check
jobs:
  buildSite:
    # Only run this job for events that originate on this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      GOPATH: ${{ github.workspace }}/go
    name: Install deps and build site
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v3

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'yarn'
          cache-dependency-path: |
            yarn.lock
            infrastructure/yarn.lock
            theme/yarn.lock
            theme/stencil/yarn.lock

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.157.0'
          extended: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::571684982431:role/ContinuousDelivery
          role-session-name: docs-deploy
          role-duration-seconds: 7200
          aws-region: us-west-2

      - name: Install s5cmd v2.3.0 for fast S3 uploads
        run: |
          S5CMD_VERSION="2.3.0"
          S5CMD_SHA256="de0fdbfa3aceae55e069ba81a0fc17b2026567637603734a387b2fca06c299b4"
          curl -fsSL -o /tmp/s5cmd.tar.gz "https://github.com/peak/s5cmd/releases/download/v${S5CMD_VERSION}/s5cmd_${S5CMD_VERSION}_Linux-64bit.tar.gz"
          echo "${S5CMD_SHA256}  /tmp/s5cmd.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin s5cmd -f /tmp/s5cmd.tar.gz
          rm /tmp/s5cmd.tar.gz

      - name: Install Vale (required by scripts/ensure.sh)
        run: |
          VALE_VERSION="3.14.1"
          VALE_SHA256="ff2b49ffaa9dcd246fd5008f03ff67746d2790b75bf4d3657e2fb9530fb96db3"
          curl -fsSL -o /tmp/vale.tar.gz "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  /tmp/vale.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin vale -f /tmp/vale.tar.gz
          rm /tmp/vale.tar.gz

      - name: Install Pulumi CLI
        uses: pulumi/actions@v7

      # Restore previously generated OpenGraph cards so the build-time generator
      # only re-renders pages that changed (manifest content-hash skip). The
      # cards are gitignored; this cache is their only persistence across runs.
      - name: Cache generated meta images
        uses: actions/cache@v6
        with:
          path: assets/images/generated
          key: meta-images-${{ github.sha }}
          restore-keys: |
            meta-images-

      # Persist Hugo's processed-image cache (resources/_gen). Blog templates
      # process feature images to WebP at several sizes via .Process; without
      # this cache every CI run re-encodes ~2,400 images from scratch (~4-5
      # minutes of the build). With a warm cache, .Process is a lookup.
      - name: Cache Hugo processed images
        uses: actions/cache@v6
        with:
          path: resources
          key: hugo-resources-${{ github.sha }}
          restore-keys: |
            hugo-resources-

      - name: Build and deploy
        run: make ci_pull_request
        env:
          CDN_PULUMI_URN: ${{ vars.CDN_PULUMI_URN }}
          PULUMI_ACCESS_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_ACCESS_TOKEN }}
          PULUMI_STACK_NAME: ${{ vars.PULUMI_STACK_NAME }}
          DEPLOYMENT_ENVIRONMENT: ${{ vars.DEPLOYMENT_ENVIRONMENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULUMI_BOT_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
          ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
          ALGOLIA_APP_SEARCH_KEY: ${{ vars.ALGOLIA_APP_SEARCH_KEY }}
          ALGOLIA_APP_ADMIN_KEY: ${{  steps.esc-secrets.outputs.ALGOLIA_APP_ADMIN_KEY }}
          NODE_OPTIONS: "--max_old_space_size=8192"

      - name: Archive test results
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: cypress/videos

      - name: Archive bucket metadata
        uses: actions/upload-artifact@v7
        with:
          name: origin-bucket-metadata
          path: origin-bucket-metadata.json

  # Advisory performance audit of the PR preview deployment. This runs as its own
  # job, rather than at the tail of buildSite, so a check that blocks nothing isn't
  # sitting on the critical path of the check that does. It deliberately skips
  # `make ensure` and installs only Lighthouse — a full install would eat the savings.
  lighthouse:
    # Only run this job for events that originate on this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Lighthouse performance audit
    runs-on: ubuntu-latest
    environment: testing
    needs: [buildSite]
    # The audit is advisory and gates nothing, so a failure here must never turn the
    # workflow run red. This preserves the behavior of the `|| true` that wrapped the
    # audit back when it ran inside buildSite.
    continue-on-error: true
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v3

      - uses: actions/checkout@v7

      # Audit only when the PR contains changes that could meaningfully affect
      # performance scores (layouts, CSS/JS bundles, Hugo config, etc.). Content-only
      # changes skip the rest of this job.
      - name: Check for performance-relevant changes
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          performance_paths=(
              "^layouts/"
              "^theme/"
              "^assets/"
              "^static/js/"
              "^static/css/"
              "^static/fonts/"
              "^static/icons/"
              "^static/images/"
              "^static/logos/"
              "^config/"
              "^hugo\."
          )
          performance_pattern="$(IFS="|"; echo "${performance_paths[*]}")"
          changed_files="$(gh pr diff "${{ github.event.pull_request.number }}" --name-only 2>/dev/null || true)"

          if echo "$changed_files" | grep -qE "$performance_pattern"; then
              echo "Performance-relevant files changed. Running Lighthouse audit..."
              echo "perf=true" >> "$GITHUB_OUTPUT"
          else
              echo "No performance-relevant file changes detected. Skipping Lighthouse audit."
              echo "perf=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.filter.outputs.perf == 'true'
        with:
          node-version: '24.x'

      # The preview URL to audit, published by buildSite's sync-and-test-bucket.sh.
      - uses: actions/download-artifact@v8
        if: steps.filter.outputs.perf == 'true'
        with:
          name: origin-bucket-metadata

      # Install Lighthouse only, at the version yarn.lock resolves for the root
      # package.json dependency, so this job can't drift from a local `make` run.
      #
      # The install runs under a --prefix outside the checkout: `npm install <pkg>`
      # reifies the whole tree from whatever package.json it finds, so installing in
      # the repo root would drag in all ~900 root dependencies (Cypress downloads a
      # multi-hundred-megabyte binary in its postinstall) and eat the savings this
      # job exists for. Symlinking the result back to ./node_modules keeps Node's
      # resolution working for scripts/lighthouse/run-audits.mjs.
      - name: Install Lighthouse
        if: steps.filter.outputs.perf == 'true'
        run: |
          LH_VERSION="$(node -e '
            const lock = require("fs").readFileSync("yarn.lock", "utf8");
            const match = lock.match(/^"?lighthouse@[^\n]*:\n  version "([^"]+)"/m);
            if (!match) {
                console.error("Could not determine the Lighthouse version from yarn.lock.");
                process.exit(1);
            }
            console.log(match[1]);
          ')"
          echo "Installing lighthouse@${LH_VERSION}..."
          npm install --no-save --no-audit --no-fund --prefix "${RUNNER_TEMP}/lighthouse" "lighthouse@${LH_VERSION}"
          ln -s "${RUNNER_TEMP}/lighthouse/node_modules" node_modules

      - name: Run audits and post report
        if: steps.filter.outputs.perf == 'true'
        run: ./scripts/run-lighthouse-pr.sh
        env:
          PULUMI_BOT_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}

  notify:
    if: (startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/master' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'pulumi-bot')) && failure()
    name: Send slack notification
    runs-on: ubuntu-latest
    needs: [buildSite]
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v3
      - name: Slack Notification
        uses: docker://sholung/action-slack-notify:v2.3.0
        env:
          SLACK_CHANNEL: docs-ops
          SLACK_COLOR: "#F54242"
          SLACK_MESSAGE: "build and deploy failure in pulumi/docs repo :meow_sad:"
          SLACK_USERNAME: docsbot
          SLACK_WEBHOOK: ${{ steps.esc-secrets.outputs.SLACK_WEBHOOK_URL }}
          SLACK_ICON: https://www.pulumi.com/logos/brand/avatar-on-white.png
env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-docs
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false
