name: Invalidate marketing-web cache
run-name: Invalidate marketing-web cache

# Invalidates the pages pulumi/marketing-web serves behind the CloudFront CDN managed by pulumi/docs
# (the paths in infrastructure/marketingWebPaths.ts). We do this with a workflow dispatch because
# marketing-web deploys on its own schedule (so its cache needs to be cleared independently of pulumi/docs
# deployments), and it makes more sense for marketing-web to notify pulumi/docs of this event (so it can
# handle the event on its own), rather than for us to reach into its live, running infrastructure from the outside.
on:
  repository_dispatch:
    types: [dev-deployed]
  # Manual escape hatch / for testing.
  workflow_dispatch:
    inputs:
      paths:
        description: Space-separated CloudFront paths to invalidate (default: the marketingWebPaths stack output)
        default: ""

permissions:
  id-token: write # OIDC for the AWS + ESC logins
  contents: read

concurrency:
  # Collapse a burst of marketing-web deploys into a single in-flight
  # invalidation rather than firing one per deploy.
  group: invalidate-marketing-web-cache
  cancel-in-progress: false

jobs:
  invalidate:
    name: Invalidate CloudFront marketing-web cache
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v3

      - uses: actions/checkout@v7

      - name: Install Pulumi CLI
        uses: pulumi/actions@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # Same delivery role build-and-deploy.yml uses; it already carries
          # cloudfront:CreateInvalidation on this distribution.
          role-to-assume: arn:aws:iam::388588623842:role/ContinuousDelivery
          role-session-name: marketing-web-cache-invalidation
          aws-region: us-west-2

      - name: Invalidate marketing-web paths
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_ACCESS_TOKEN }}
          PULUMI_STACK_NAME: ${{ vars.PULUMI_STACK_NAME }}
          PATHS: ${{ github.event.client_payload.paths || github.event.inputs.paths }}
        run: |
          # noglob keeps paths like /dev/* from expanding against the runner's filesystem.
          set -o errexit -o pipefail -o noglob
          if [ -z "$PATHS" ]; then
            PATHS=$(pulumi -C infrastructure stack output marketingWebPaths --json --stack "$PULUMI_STACK_NAME" | jq -r 'join(" ")')
          fi
          if [ -z "$PATHS" ]; then
            echo "Could not resolve marketingWebPaths from stack $PULUMI_STACK_NAME" >&2
            exit 1
          fi
          DISTRIBUTION_ID=$(pulumi -C infrastructure stack output cloudFrontDistributionId --stack "$PULUMI_STACK_NAME")
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "Could not resolve cloudFrontDistributionId from stack $PULUMI_STACK_NAME" >&2
            exit 1
          fi
          echo "Invalidating [$PATHS] on distribution $DISTRIBUTION_ID"
          # Word-splitting on PATHS is intentional (one arg per path).
          # shellcheck disable=SC2086
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths $PATHS

env:
  # Mirrors build-and-deploy.yml so pulumi/esc-action can mint the org token
  # that yields PULUMI_ACCESS_TOKEN.
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-docs
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false
