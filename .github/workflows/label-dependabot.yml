name: Label Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test labeling on'
        required: true
        type: number

jobs:
  label:
    # head.repo guard mirrors auto-approve-for-auto-merge.yml: github.actor
    # alone is spoofable from a fork.
    if: >-
      (github.actor == 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Dependabot signs its update metadata into the commit, which is the only
      # reliable source for which dependencies a PR touches and whether it is a
      # security update. Parsing the PR body cannot do either job correctly --
      # see the comments in the script step below. Not available on
      # workflow_dispatch (no Dependabot commit to read), so the script keeps a
      # body-parsing fallback for that path only.
      - name: Fetch Dependabot metadata
        id: meta
        if: github.event_name == 'pull_request'
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Label and triage Dependabot PR
        id: triage
        uses: actions/github-script@v9
        env:
          META_DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
          META_GHSA_ID: ${{ steps.meta.outputs.ghsa-id }}
          META_ALERT_STATE: ${{ steps.meta.outputs.alert-state }}
          AUTO_MERGE_ENABLED: ${{ vars.DEPS_AUTO_MERGE }}
        with:
          script: |
            // Get PR details - either from event payload or workflow input
            let prNumber, prTitle, prBody;

            if (context.eventName === 'workflow_dispatch') {
              // Manual trigger - fetch PR details
              prNumber = parseInt(context.payload.inputs.pr_number);
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              prTitle = pr.title;
              prBody = pr.body || '';
            } else {
              // Automatic trigger from PR event
              prNumber = context.payload.pull_request.number;
              prTitle = context.payload.pull_request.title;
              prBody = context.payload.pull_request.body || '';
            }

            // Bundler/SDK updates can blow the 1MB Lambda@Edge bundle limit.
            // Once auto-merge is armed this stops being advisory and becomes a
            // merge gate, so it covers what /infrastructure actually bumps --
            // @pulumi/aws and @pulumi/pulumi are what get bundled into the
            // Lambda@Edge function -- alongside the bundlers themselves.
            //
            // Matching is by dependency NAME, with no directory scoping, so
            // this deliberately over-captures in one known case:
            // /infrastructure/versioned-docs is a sibling Pulumi program that
            // is never bundled into Lambda@Edge, yet carries the same two
            // @pulumi packages and will therefore be held. Failing closed is
            // the right default for a merge gate, and a name-only match cannot
            // tell the two apart, so that PR gets a human look. Accepted.
            //
            // The patterns are the two exact package names rather than a
            // '@pulumi/' prefix, which would also match @pulumi/design-tokens
            // in theme/package.json -- a design-token package with no
            // Lambda@Edge relevance whose monthly bump would be held for no
            // reason.
            const lambdaEdgeRiskDeps = [
              'webpack', '-loader', '-webpack-plugin', '@aws-sdk/',
              '@pulumi/aws', '@pulumi/pulumi', 'esbuild', 'rollup', 'terser'
            ];

            // A grouped PR at or above this size is held for human review.
            // Lowered from 10 to 5 because this is now a merge gate rather
            // than a note: the 2026-09-01 batch contained groups of 2, 3, 7, 9
            // and 10, so a threshold of 10 would auto-merge a 9-package bump
            // unreviewed. Raise it if that proves too conservative.
            const BULK_UPDATE_THRESHOLD = 5;

            // Prefer Dependabot's own signed metadata. It is the only source
            // that is correct for GROUPED PRs, and grouped PRs are the only
            // ones that can be bulk.
            //
            // The previous body regex was /(?:Bumps|Updates) \[([^\]]+)\]/g.
            // A grouped body reads:
            //
            //   Bumps the all-dependencies group in /infrastructure with 2
            //   updates: [@pulumi/aws](...) and [@pulumi/pulumi](...).
            //   Updates `@pulumi/aws` from 7.39.0 to 7.44.0
            //
            // "Bumps the" has no bracket after it, and the per-dependency
            // lines use backticks. The title fallback missed too: a grouped
            // title has no " from ". So `dependencies` was [] on every grouped
            // PR and neither deps-bulk-update nor deps-lambda-edge-risk could
            // ever fire. Confirmed in the wild: #21282 ("with 10 updates") and
            // #20711 ("with 12 updates") carry no deps-bulk-update label.
            // Tracked separately from `dependencies` because the fallback
            // below fills that array in, which would otherwise make it look
            // like metadata had been available.
            const metadataAvailable =
              (process.env.META_DEPENDENCY_NAMES || '').trim() !== '';

            let dependencies = (process.env.META_DEPENDENCY_NAMES || '')
              .split(',')
              .map(s => s.trim())
              .filter(Boolean);

            if (!metadataAvailable) {
              // workflow_dispatch path only: fetch-metadata cannot run without
              // a Dependabot commit. Handles both body shapes.
              const found = new Set();
              const patterns = [
                /(?:Bumps|Updates) \[([^\]]+)\]/g,
                /^Updates `([^`]+)` from /gm,
              ];
              for (const pattern of patterns) {
                let match;
                while ((match = pattern.exec(prBody)) !== null) {
                  found.add(match[1]);
                }
              }
              const titleMatch = prTitle.match(/bump\s+(.+?)\s+from/i);
              if (titleMatch) {
                found.add(titleMatch[1]);
              }
              dependencies = [...found];
            }

            // Flag Lambda@Edge bundling risk
            let hasLambdaEdgeRisk = false;
            for (const dep of dependencies) {
              const depLower = dep.toLowerCase();
              if (lambdaEdgeRiskDeps.some(pattern => depLower.includes(pattern.toLowerCase()))) {
                hasLambdaEdgeRisk = true;
              }
            }

            // Prepare labels to add (`dependencies` is already applied via dependabot.yml)
            const labelsToAdd = ['dependencies'];

            // Never test for the word "security" in the title or body. Every
            // single-dependency Dependabot PR carries boilerplate containing
            // it -- a compatibility-score link to
            // "about-dependabot-security-updates", and the footer "You can
            // disable automated security fix PRs for this repo from the
            // Security Alerts page". Measured on this repo: 207 Dependabot PRs
            // match that boilerplate; only 52 reference an actual advisory.
            // That is why routine version bumps were being tagged
            // "Security update, merge immediately" and the label stopped
            // meaning anything.
            //
            // fetch-metadata reads the advisory out of Dependabot's commit
            // metadata, so it is exact for both single and grouped PRs.
            const ghsaId = (process.env.META_GHSA_ID || '').trim();
            const alertState = (process.env.META_ALERT_STATE || '').trim();
            let isSecurity = ghsaId !== '' || alertState !== '';

            if (!metadataAvailable) {
              // workflow_dispatch path only. Match advisory identifiers, never
              // the bare word. This under-reports -- PR #21335 is a genuine
              // security update with no GHSA anywhere in its body -- which is
              // acceptable for a manual test path but would not be on the
              // real one.
              isSecurity = /\b(?:GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}|CVE-\d{4}-\d{4,})\b/i.test(prBody);
            }

            if (isSecurity) {
              labelsToAdd.push('deps-security-patch');
            }

            // Check for bulk updates
            const isBulk = dependencies.length >= BULK_UPDATE_THRESHOLD;
            if (isBulk) {
              labelsToAdd.push('deps-bulk-update');
            }

            // Add Lambda@Edge risk flag
            if (hasLambdaEdgeRisk) {
              labelsToAdd.push('deps-lambda-edge-risk');
            }

            // Add ecosystem label based on PR labels. context.payload
            // .pull_request is undefined on the workflow_dispatch path, which
            // used to throw before the labels were ever applied.
            const existingLabels =
              (context.payload.pull_request?.labels || []).map(l => l.name);
            if (existingLabels.includes('npm')) labelsToAdd.push('npm');
            if (existingLabels.includes('github-actions')) labelsToAdd.push('github-actions');

            // Consumed by the auto-merge step (added separately, once the ESC
            // probe below has confirmed a usable token on a real Dependabot
            // run). Held categories mirror BUILD-AND-DEPLOY.md's Infrastructure
            // Change Review: bundle-size risk and batches too large to eyeball.
            const autoMergeEligible = !hasLambdaEdgeRisk && !isBulk;
            core.setOutput('auto_merge', String(autoMergeEligible));
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('held_reason', hasLambdaEdgeRisk
              ? 'lambda-edge-risk'
              : (isBulk ? 'bulk-update' : ''));
            console.log(`Auto-merge eligible: ${autoMergeEligible} ` +
              `(lambdaEdgeRisk=${hasLambdaEdgeRisk}, bulk=${isBulk}, ` +
              `deps=${dependencies.length}, security=${isSecurity})`);

            // Apply labels
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: labelsToAdd
              });
              console.log(`Applied labels: ${labelsToAdd.join(', ')}`);
            } catch (error) {
              console.error('Failed to apply labels:', error.message);
              core.setFailed(`Failed to apply labels: ${error.message}`);
            }

            // Generate triage comment
            let triageComment = '## Automated Dependabot Triage\n\n';
            triageComment += `**Dependencies:** ${dependencies.length > 0 ? dependencies.join(', ') : 'See PR body'}\n\n`;

            if (isSecurity) {
              triageComment += '🔒 **Security Update** - Prioritize: evaluate and merge promptly.\n\n';
            }

            const autoMergeOn = (process.env.AUTO_MERGE_ENABLED || '') === 'true';

            if (autoMergeOn && autoMergeEligible) {
              triageComment += '🤖 **Auto-merge armed.** No risk flags, so this PR is approved and will merge itself once the required build check passes. No action needed.\n\n';
            } else {
              if (autoMergeOn) {
                const why = hasLambdaEdgeRisk
                  ? 'it carries `deps-lambda-edge-risk`'
                  : `it bumps ${dependencies.length} dependencies (\`deps-bulk-update\`)`;
                triageComment += `✋ **Held for review** because ${why}. Auto-merge is not armed for this PR.\n\n`;
              }
              triageComment += '**Evaluate and merge:**\n';
              triageComment += '- [ ] Run `make build` (or `make serve-all` for browser-facing changes) and verify the site builds and loads\n';
              triageComment += '- [ ] Spot-check search, console errors, and markdown rendering\n';
              triageComment += '- [ ] Merge once CI is green\n\n';
            }

            if (hasLambdaEdgeRisk) {
              triageComment += '🚨 **Lambda@Edge Risk** - This update affects webpack, bundlers, or AWS SDK. ';
              triageComment += 'See [Infrastructure Change Review](https://github.com/pulumi/docs/blob/master/BUILD-AND-DEPLOY.md#infrastructure-change-review) ';
              triageComment += 'section for deployment risks.\n\n';
            }

            if (isBulk) {
              triageComment += `📦 **Bulk Update** - ${dependencies.length} dependencies. Review carefully for conflicts.\n\n`;
            }

            triageComment += '### Claude Code Review\n\n';
            triageComment += 'Automated Claude reviews are not available for Dependabot PRs. ';
            triageComment += 'To review this PR with Claude Code, run:\n\n';
            triageComment += '```bash\n';
            triageComment += `/pr-review ${prNumber}\n`;
            triageComment += '```\n\n';

            triageComment += '---\n';
            triageComment += 'For detailed triage guidance, see the [Dependency Management](https://github.com/pulumi/docs/blob/master/BUILD-AND-DEPLOY.md#dependency-management) section in BUILD-AND-DEPLOY.md.\n';

            // Post comment
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: triageComment
              });
              console.log(`Posted triage comment for ${dependencies.length} dependencies`);
            } catch (error) {
              console.error('Failed to post comment:', error.message);
              // Don't fail the workflow if comment posting fails
            }

      # Mints PULUMI_BOT_TOKEN for the approve/merge step below.
      #
      # Run 33815532057 established that ESC over OIDC works on a
      # `pull_request` event with no `environment:` set, and that the token
      # authenticates as pulumi-bot. Because the actor is not part of the OIDC
      # subject claim -- `repo:pulumi/docs:pull_request` either way -- that run
      # also shows ESC's trust policy will match on a Dependabot-opened PR.
      # (`environment: testing`, which pull-request.yml's buildSite sets,
      # produces a different subject and is not needed here.)
      #
      # It does NOT establish the step before that. GitHub applies its own
      # event-level policy to Dependabot-triggered runs -- the reason they get
      # a read-only GITHUB_TOKEN and Dependabot secrets rather than Actions
      # secrets -- so an identical subject does not by itself prove an OIDC
      # token is minted on that path. This job already carries
      # `pull-requests: write` and succeeds on real Dependabot PRs, which is
      # suggestive but not proof for `id-token: write`.
      #
      # Nothing breaks if it doesn't work: the step is continue-on-error and
      # the merge step below requires a non-empty token, so the failure mode is
      # "never arms", not "merges wrongly". The report step logs the outcome so
      # the first real Dependabot run settles it -- check that before setting
      # DEPS_AUTO_MERGE.
      #
      # PULUMI_BOT_TOKEN rather than GITHUB_TOKEN is not a preference:
      # build-and-deploy.yml triggers on push to master, and events created
      # with GITHUB_TOKEN do not trigger workflows, so a GITHUB_TOKEN merge
      # would land without ever deploying the site. The three daily scheduled
      # rebuilds would paper over that for hours, which makes it harder to
      # notice, not safer. The 18 workflows that already call
      # `gh pr merge --auto` all use PULUMI_BOT_TOKEN for this reason.
      #
      # continue-on-error so a failure here can never affect labelling.
      - name: Fetch ESC secrets
        id: esc-secrets
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: pulumi/esc-action@v3

      - name: Report ESC token availability
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PROBE_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
        run: |
          if [ -n "${PROBE_TOKEN}" ]; then
            echo "ESC token acquired on a ${{ github.actor }}-triggered run."
          else
            echo "NO ESC token on a ${{ github.actor }}-triggered run."
            echo "Auto-merge cannot arm. Do not set DEPS_AUTO_MERGE until this reads yes."
          fi

      # Approve as pulumi-bot and hand the PR to GitHub's native auto-merge,
      # which waits for the required build check on its own -- there is nothing
      # to poll here, and the ~10 minute build is GitHub's problem.
      #
      # Approving as pulumi-bot is deliberate. master requires an approving
      # review, and a bot approving a bot-authored PR gated on CI states that
      # policy plainly. The alternative it replaces -- a routine that stamped
      # every Dependabot PR under a human's name -- manufactured a trail
      # showing a person had reviewed dependency bumps nobody read.
      #
      # Gated on the DEPS_AUTO_MERGE repo variable (unset = off), so this
      # workflow can land and collect probe evidence before anything merges
      # unattended. Same switch pattern as BLOG_REVIEW_COUNT. To disable in a
      # hurry, unset the variable; in-flight PRs can be released individually
      # with `gh pr merge --disable-auto <n>`.
      - name: Approve and enable auto-merge
        if: >-
          github.event_name == 'pull_request' &&
          vars.DEPS_AUTO_MERGE == 'true' &&
          steps.triage.outputs.auto_merge == 'true' &&
          steps.esc-secrets.outputs.PULUMI_BOT_TOKEN != ''
        env:
          GH_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
          PR: ${{ steps.triage.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Re-approving after a Dependabot rebase is a no-op update, not an
          # error, so this is safe on `synchronize` as well as `opened`.
          gh pr review "$PR" --approve \
            --body "Auto-approved by label-dependabot.yml: no deps-lambda-edge-risk or deps-bulk-update flag. The merge itself is gated on the required build check."
          gh pr merge "$PR" --auto --squash
          echo "Auto-merge armed for #${PR}."

env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-docs
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false
