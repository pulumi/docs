# Regenerates content/docs/administration/self-hosting/feature-parity.md from
# the feature definitions and LaunchDarkly checks in the private
# pulumi/pulumi-service repo, and opens a PR when the page changes.
# See scripts/self-hosted-feature-parity/README.md.
#
# Like the CLI and SDK docs regens, the PR auto-merges, with one exception: if
# a row with hand-written Details changes status, the PR waits for a person to
# check the Details still match. So does a manual run against another branch.
#
# This repo's workflow logs are public. The generator's internal outputs
# (scripts/self-hosted-feature-parity/generated/) name internal flags and
# unreleased features, so this job must never print them, upload them, or run
# the --enrich and --full-report modes.
permissions:
  contents: read
  id-token: write

env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-docs
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false

name: Self-hosted feature parity

concurrency:
  group: self-hosted-feature-parity
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      pulumi_service_branch:
        description: "pulumi-service branch to read (defaults to production, what the released images are built from)"
        required: false
        default: ""
  schedule:
    # Nightly at 07:45 UTC, after the other data-committing jobs (06:45-07:30).
    - cron: "45 7 * * *"
jobs:
  update-feature-parity:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}
      auto_merge: ${{ steps.changes.outputs.needs_review == 'false' && github.event.inputs.pulumi_service_branch == '' }}
      changes: ${{ steps.changes.outputs.changes }}
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v3
      # Branches only: checking out a SHA or tag detaches HEAD, and git then
      # logs the private commit's subject line.
      - name: Check the pulumi-service branch
        if: github.event.inputs.pulumi_service_branch != ''
        env:
          GH_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
          BRANCH: ${{ github.event.inputs.pulumi_service_branch }}
        run: |
          if ! gh api "repos/pulumi/pulumi-service/branches/${BRANCH}" --silent; then
            echo "::error::pulumi_service_branch must name an existing pulumi-service branch"
            exit 1
          fi
      - name: Check out the docs repo
        uses: actions/checkout@v7
        with:
          path: docs
          token: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
      # The generator walks cmd/ and pkg/ for LaunchDarkly checks. Fails the job
      # if pulumi-bot loses access to the repo, rather than keeping a stale page.
      - name: Check out pulumi-service
        uses: actions/checkout@v7
        with:
          repository: pulumi/pulumi-service
          # production is what pulumi/service:latest and the dated Docker Hub
          # tags are built from (push-build.yml in pulumi-service); master
          # only publishes :edge.
          ref: ${{ github.event.inputs.pulumi_service_branch || 'production' }}
          path: pulumi-service
          token: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            cmd
            pkg
      # The generator parses pulumi-service's Go, so it needs a toolchain at
      # least as new as the one pulumi-service uses.
      - uses: actions/setup-go@v7
        with:
          go-version-file: pulumi-service/go.mod
          cache: false
      # Each step is run by name rather than with --all, which skips quietly
      # when there's no pulumi-service clone. --enrich is left out on purpose.
      - name: Regenerate the feature parity page
        working-directory: docs
        env:
          PULUMI_SERVICE_REPO: ${{ github.workspace }}/pulumi-service
        run: |
          go run scripts/update-feature-parity.go --generate-raw
          go run scripts/update-feature-parity.go --update-summary
          go run scripts/update-feature-parity.go --publish
      - name: List status changes
        id: changes
        working-directory: docs
        run: |
          page=content/docs/administration/self-hosting/feature-parity.md
          git show "HEAD:$page" > "$RUNNER_TEMP/feature-parity-before.md"
          python3 scripts/self-hosted-feature-parity/status-changes.py "$RUNNER_TEMP/feature-parity-before.md" "$page"
      - name: git status
        working-directory: docs
        run: git status && git diff -- content/docs/administration/self-hosting/feature-parity.md
      - name: Commit changes
        id: commit
        working-directory: docs
        run: |
          git config --local user.email "bot@pulumi.com"
          git config --local user.name "pulumi-bot"
          git checkout -b self-hosted-feature-parity/${{ github.run_id }}-${{ github.run_number }}
          git add content/docs/administration/self-hosting/feature-parity.md
          if git diff --cached --quiet; then
            echo "No feature parity changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update self-hosted feature parity"
            git push origin self-hosted-feature-parity/${{ github.run_id }}-${{ github.run_number }}
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
  pull-request:
    runs-on: ubuntu-latest
    needs: update-feature-parity
    if: needs.update-feature-parity.outputs.has_changes == 'true'
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v3
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Open pull request
        id: create-pr
        uses: repo-sync/pull-request@v2
        with:
          source_branch: "self-hosted-feature-parity/${{ github.run_id }}-${{ github.run_number }}"
          destination_branch: "master"
          pr_title: "Update self-hosted feature parity"
          pr_body: |
            Automated regeneration of the [self-hosted feature parity page](/docs/administration/self-hosting/feature-parity/) from pulumi-service by the [Self-hosted feature parity](https://github.com/${{ github.repository }}/blob/master/.github/workflows/self-hosted-feature-parity.yml) workflow.

            Status changes:

            ${{ needs.update-feature-parity.outputs.changes }}

            ${{ needs.update-feature-parity.outputs.auto_merge == 'true' && 'No changed row has hand-written Details, so this PR merges on its own.' || 'A changed row has hand-written Details (or this run read a non-default pulumi-service branch), so this PR needs a review: check each flagged row''s Details still match its new status, and if not, update `public_notes` in `scripts/self-hosted-feature-parity/feature-publish-config.json` and rerun `make generate-feature-parity`.' }}

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          pr_label: ${{ needs.update-feature-parity.outputs.auto_merge == 'true' && 'automation/merge' || '' }}
          github_token: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
      - name: Enable auto-merge
        if: steps.create-pr.outputs.pr_created == 'true' && needs.update-feature-parity.outputs.auto_merge == 'true'
        run: gh pr merge ${{ steps.create-pr.outputs.pr_number }} --auto --squash
        env:
          GITHUB_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
  notify:
    if: failure()
    name: Send slack notification
    runs-on: ubuntu-latest
    needs: [update-feature-parity, pull-request]
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v3
      - name: Slack Notification
        uses: docker://sholung/action-slack-notify:v2.3.0
        env:
          SLACK_CHANNEL: docs-ops
          SLACK_COLOR: "#F54242"
          SLACK_MESSAGE: "Self-hosted feature parity update failure in pulumi/docs repo :meow_sad:"
          SLACK_USERNAME: docsbot
          SLACK_WEBHOOK: ${{ steps.esc-secrets.outputs.SLACK_WEBHOOK_URL }}
          SLACK_ICON: https://www.pulumi.com/logos/brand/avatar-on-white.png
