name: Post-Deployment Health Check

on:
  workflow_run:
    workflows:
      - "Build and deploy"
      - "Build and deploy testing"
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to health check'
        required: true
        type: choice
        options:
          - https://www.pulumi.com
          - https://www.pulumi-test.io
        default: 'https://www.pulumi.com'
      environment:
        description: 'Environment name (for Slack notifications)'
        required: true
        type: choice
        options:
          - production
          - testing
        default: 'production'

permissions:
  contents: read

env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-docs
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false

jobs:
  health-check:
    name: Run post-deployment health checks
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      url: ${{ steps.target.outputs.url }}
      environment: ${{ steps.target.outputs.environment }}
      slack_channel: ${{ steps.target.outputs.slack_channel }}

    steps:
      - name: Determine target environment
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "url=${{ inputs.target_url }}" >> $GITHUB_OUTPUT
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            if [[ "${{ inputs.environment }}" == "production" ]]; then
              echo "slack_channel=docs-ops" >> $GITHUB_OUTPUT
            else
              echo "slack_channel=docs-ops-test" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.event.workflow_run.name }}" == "Build and deploy" ]]; then
            echo "url=https://www.pulumi.com" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "slack_channel=docs-ops" >> $GITHUB_OUTPUT
          else
            echo "url=https://www.pulumi-test.io" >> $GITHUB_OUTPUT
            echo "environment=testing" >> $GITHUB_OUTPUT
            echo "slack_channel=docs-ops-test" >> $GITHUB_OUTPUT
          fi

      - name: Run health checks
        run: |
          #!/bin/bash
          set -e

          BASE_URL="${{ steps.target.outputs.url }}"
          FAILED=0

          echo "🏥 Post-Deployment Health Check"
          echo "Target: $BASE_URL"
          echo ""

          # Signature string rendered in the body of the site's 404 page. A page
          # that returns HTTP 200 but serves this body is a soft 404: the status
          # code alone is not enough to prove the page actually rendered.
          SOFT_404_SIGNATURE="404 Page not found"

          # Function to check endpoint returns 200 with a real (non-404) body
          check_endpoint() {
            local path="$1"
            local name="$2"
            local url="${BASE_URL}${path}"

            body_file=$(mktemp)
            status=$(curl -s -o "$body_file" -w "%{http_code}" -L "$url")
            if [[ "$status" != "200" ]]; then
              echo "❌ $name: Expected 200, got $status"
              FAILED=1
            elif grep -qF "$SOFT_404_SIGNATURE" "$body_file"; then
              echo "❌ $name: Got 200 but body is the 404 page (soft 404)"
              FAILED=1
            else
              echo "✅ $name: $status"
            fi
            rm -f "$body_file"
          }

          # Function to check redirect
          check_redirect() {
            local path="$1"
            local expected_location="$2"
            local name="$3"
            local url="${BASE_URL}${path}"

            # Get status and location without following redirects
            response=$(curl -s -o /dev/null -w "%{http_code}|%{redirect_url}" "$url")
            status="${response%%|*}"
            location="${response##*|}"

            if [[ "$status" == "301" ]] && [[ "$location" =~ $expected_location ]]; then
              echo "✅ $name: $status → $location"
            else
              echo "❌ $name: Expected 301 to match '$expected_location', got $status → $location"
              FAILED=1
            fi
          }

          echo "Testing endpoints..."
          check_endpoint "/" "Homepage"
          check_endpoint "/docs" "Docs landing"
          check_endpoint "/registry" "Registry landing"
          check_endpoint "/docs/reference/pkg/nodejs/pulumi/pulumi/" "Node.js SDK"
          check_endpoint "/docs/reference/pkg/python/pulumi/" "Python SDK"
          check_endpoint "/docs/reference/pkg/dotnet/pulumi/pulumi.html" ".NET SDK"
          check_endpoint "/docs/reference/pkg/java/" "Java SDK"
          check_endpoint "/docs/iac/get-started/" "Getting started"
          check_endpoint "/docs/cli/commands/" "CLI reference"
          check_endpoint "/blog/" "Blog landing"
          check_endpoint "/what-is/" "What-is landing"
          check_endpoint "/case-studies/" "Case studies landing"
          check_endpoint "/tutorials/" "Tutorials landing"
          check_endpoint "/templates/" "Templates landing"
          check_endpoint "/events/" "Events landing"
          check_endpoint "/robots.txt" "robots.txt"
          check_endpoint "/sitemap.xml" "sitemap.xml"

          echo ""
          echo "Testing multi-POP vantage points..."

          # Every check_endpoint call above issues exactly one request from
          # one GitHub Actions runner through whichever single CloudFront
          # edge location that runner happens to be routed to. That design
          # can only detect a total, POP-independent outage; it is
          # structurally blind to a partial, edge-location-scoped failure,
          # where most POPs are healthy and one or two are not. To close
          # that gap, resolve a handful of geographically distinct
          # CloudFront edge IPs (via Google's DNS-over-HTTPS API with EDNS
          # Client Subnet hints, so the same resolver hands back different
          # edges for different regions) and hit a small set of
          # high-signal canary paths directly against each one.
          #
          # This pass fails open: if fewer than two distinct edge IPs can
          # be resolved (third-party DNS hiccup, a host with no CloudFront
          # in front of it, a transient network blip), it is skipped with a
          # warning instead of failing the deploy gate on an external
          # dependency this workflow does not control.

          HOST="${BASE_URL#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST%%/*}"

          ECS_SUBNETS=(
            "91.198.174.0/24"
            "133.11.0.0/24"
            "200.160.0.0/24"
            "1.128.0.0/24"
            "152.3.0.0/24"
          )

          POP_IPS=()
          for subnet in "${ECS_SUBNETS[@]}"; do
            resolved_ip=$(curl -s --max-time 8 "https://dns.google/resolve?name=${HOST}&type=A&edns_client_subnet=${subnet}" 2>/dev/null \
              | grep -oE '"data":"[0-9]{1,3}(\.[0-9]{1,3}){3}"' | grep -oE '[0-9]+(\.[0-9]+){3}' | head -1 || true)
            if [[ -n "$resolved_ip" ]]; then
              already_have=0
              for existing in "${POP_IPS[@]:-}"; do
                [[ "$existing" == "$resolved_ip" ]] && already_have=1
              done
              [[ "$already_have" -eq 0 ]] && POP_IPS+=("$resolved_ip")
            fi
          done

          if [[ "${#POP_IPS[@]}" -lt 2 ]]; then
            echo "⚠️  Skipping multi-POP pass: only resolved ${#POP_IPS[@]} distinct edge IP(s) via DNS-over-HTTPS (expected several). Not failing the build on this external dependency."
          else
            echo "Resolved ${#POP_IPS[@]} distinct edge IPs to check: ${POP_IPS[*]}"

            CANARY_PATHS=("/" "/docs/" "/registry/")

            check_pop_once() {
              local ip="$1"
              local path="$2"
              local hdr body status pop cache

              hdr=$(mktemp)
              body=$(mktemp)
              # --connect-timeout keeps a dead/unroutable edge IP from
              # burning the full --max-time on every attempt; curl already
              # writes "000" via -w on a hard failure, so the fallback only
              # fires when status comes back empty (avoids concatenating
              # two "000"s into one unparsed string).
              status=$(curl -s -o "$body" -D "$hdr" -w "%{http_code}" --connect-timeout 5 --max-time 10 --resolve "${HOST}:443:${ip}" "https://${HOST}${path}" 2>/dev/null || true)
              [[ -z "$status" ]] && status="000"
              # On a cache miss, CloudFront distributions fronted by a
              # regional edge cache / origin shield emit *two*
              # x-amz-cf-pop header lines (the viewer-facing edge, then the
              # shield). Take only the first (the viewer-facing edge, which
              # is what a real user actually hit) so the label stays a
              # single POP code instead of two concatenated by a newline.
              pop=$(grep -i '^x-amz-cf-pop:' "$hdr" 2>/dev/null | head -1 | tr -d '\r' | awk '{print $2}' || true)
              cache=$(grep -i '^x-cache:' "$hdr" 2>/dev/null | head -1 | tr -d '\r' | cut -d' ' -f2- || true)
              [[ -z "$pop" ]] && pop="unknown"

              if [[ "$status" != "200" ]]; then
                echo "  [$ip / pop=$pop] $path -> HTTP $status"
                rm -f "$hdr" "$body"
                return 1
              elif grep -qF "$SOFT_404_SIGNATURE" "$body"; then
                echo "  [$ip / pop=$pop] $path -> 200 but soft 404"
                rm -f "$hdr" "$body"
                return 1
              else
                echo "  [$ip / pop=$pop / cache=${cache:-n/a}] $path -> $status"
                rm -f "$hdr" "$body"
                return 0
              fi
            }

            for ip in "${POP_IPS[@]}"; do
              for path in "${CANARY_PATHS[@]}"; do
                if ! check_pop_once "$ip" "$path"; then
                  echo "  ⚠️  first attempt failed for $ip$path, retrying once after 5s..."
                  sleep 5
                  if ! check_pop_once "$ip" "$path"; then
                    echo "❌ Multi-POP check: $ip$path failed twice"
                    FAILED=1
                  else
                    echo "⚠️  Multi-POP check: $ip$path failed once, passed on retry (transient)"
                  fi
                fi
              done
            done
          fi

          echo ""
          echo "Testing Lambda@Edge redirects..."
          check_redirect "/docs/intro/cloud-providers/aws/" "/registry/packages/aws/" "Cloud provider redirect"
          check_redirect "/docs/reference/pkg/nodejs/pulumi/aws/" "/docs/reference/pkg/aws/\\?language=nodejs" "Node.js SDK redirect"

          echo ""
          echo "=================================================="
          if [[ $FAILED -eq 0 ]]; then
            echo "✅ All health checks passed!"
            exit 0
          else
            echo "❌ Some health checks failed!"
            exit 1
          fi

  notify:
    name: Send Slack notification on failure
    runs-on: ubuntu-latest
    needs: [health-check]
    if: failure()

    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v3

      - name: Send Slack notification
        uses: docker://sholung/action-slack-notify:v2.3.0
        env:
          SLACK_CHANNEL: ${{ needs.health-check.outputs.slack_channel || 'docs-ops' }}
          SLACK_COLOR: "#F54242"
          SLACK_MESSAGE: |
            🚨 Post-deployment health check failed for ${{ needs.health-check.outputs.environment || 'production' }}

            Workflow: ${{ github.event.workflow_run.html_url }}
            Deployment: ${{ github.event.workflow_run.name }}
            Commit: ${{ github.event.workflow_run.head_sha }}

            Check the workflow logs for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_USERNAME: docsbot
          SLACK_WEBHOOK: ${{ steps.esc-secrets.outputs.SLACK_WEBHOOK_URL }}
          SLACK_ICON: https://www.pulumi.com/logos/brand/avatar-on-white.png
