name: Pricing calculator API tests

# Type-checks, lints, and runs the unit suite for infrastructure/
# pricing-calculator-api/, the Pulumi program behind /api/pricing (the
# estimate endpoint Intercom's Fin calls; see that directory's README.md).
#
# It is a separate program from infrastructure/, like versioned-docs: its own
# Pulumi.yaml, package.json, yarn.lock and tsconfig.json, reached from the
# main program only by stack reference. So neither support-form-tests.yml
# (which excludes this directory for that reason) nor versioned-docs-check.yml
# examines a line of it, and this workflow is what covers it.
#
# The suite needs no credentials: the tests that parse the pricing page read a
# checked-in snapshot (src/testdata/pricing.md), never the live site.
# Deliberately standalone rather than folded into `make ci_pull_request`, for
# the same reason as the other two: that path needs AWS and Pulumi credentials
# and degrades without them, so it skips on fork PRs.
#
# Unlike versioned-docs-check.yml this runs `yarn lint` too, because this
# package's tslint config passes cleanly; keep it that way.
on:
  pull_request:
    paths:
      - 'infrastructure/pricing-calculator-api/**'
      - '.github/workflows/pricing-calculator-api-tests.yml'

permissions:
  contents: read

concurrency:
  group: pricing-calculator-api-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Run pricing calculator API test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infrastructure/pricing-calculator-api
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'yarn'
          cache-dependency-path: infrastructure/pricing-calculator-api/yarn.lock
      - name: Install deps
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      # Tee'd so the count can be asserted afterwards, as in
      # support-form-tests.yml. `yarn test` runs
      # scripts/check-test-suites-compiled.js between tsc and the runner, which
      # proves every suite will run (tsc silently skips one missing from
      # tsconfig.json's `files`); the count proves they ran assertions.
      - name: Run suite
        shell: bash
        run: |
          set -o pipefail
          yarn test 2>&1 | tee /tmp/pricing-calculator-api-tests.log
      - name: Assert the suite actually ran
        shell: bash
        run: |
          count=$(grep -oP '^# tests \K\d+|^ℹ tests \K\d+' /tmp/pricing-calculator-api-tests.log | tail -1)
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "::error::The pricing calculator API suite reported ${count:-no} tests. Something is not running."
            exit 1
          fi
          echo "Pricing calculator API suite ran $count tests."
