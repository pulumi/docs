name: Review Label Reconcile

# Safety net for the review:* label state machine.
#
# claude-code-review.yml's mark-stale job flips review:no-blockers /
# review:outstanding-issues to review:stale on `pull_request: synchronize`.
# But GitHub suppresses workflow triggers for an entire class of pushers —
# pushes made with the workflow GITHUB_TOKEN, and pushes by the Copilot
# coding agent (which additionally sit behind "Approve and run workflows") —
# so those pushes never fire synchronize and the label silently keeps
# describing a review of content that no longer exists. Observed on
# PR #20556: a Copilot conflict-resolution push at 2026-07-30T00:47Z fired
# no workflow run at all, and the PR closed still wearing review:no-blockers
# while the pinned review described the pre-conflict content.
#
# This job closes the hole from the polling side: for every open PR carrying
# a terminal-success review label, compare the SHA the pinned review recorded
# (the `<!-- CLAUDE_REVIEW_HEAD <sha> -->` sentinel compose-review.py stamps
# under the header; falling back to the last `(<sha>)` in 📜 Review history
# for reviews composed before the sentinel existed) against the live PR head.
# On a mismatch, apply the same transition mark-stale would have applied.
# When no SHA is recoverable, fall back to comparing the header's
# `Last updated` timestamp against the head commit's committer date with a
# 10-minute slack; if still indeterminate, skip — this job must never flip a
# label it can't justify.
#
# A second sweep covers the other orphan: review:in-progress with no run
# behind it. Both review lanes put up a progress signal seconds BEFORE they
# set the label — a <!-- CLAUDE_PROGRESS --> spinner comment, or, for a
# requested run, a 👀 from github-actions[bot] on the requesting comment —
# and take it down on every terminal path, so "label present, no live
# signal" cannot be a running review — it is a run that died without
# finalizing (job-level
# timeout axing the finalize steps, a lost runner, or the superseded-publish
# gap #21642 hit before claude-code-review.yml's guard learned to reset the
# label). Those PRs move to review:stale, the state the guard itself now
# uses, once the label is at least 30 minutes old (slack for API lag and
# for the update lane, which sets the label before its signal and whose
# "Working on it" spinner and auto-refresh 🔄 banner aren't read here — a
# refresh finishes well inside the window). Run-list mapping is deliberately not used: a dispatched run
# reports the default branch as its head and carries no PR number.
#
# A third sweep runs the other direction, because until it existed the label
# only ever moved TOWARD stale. A PR wearing review:stale whose review is in
# fact current at the head — a refresh whose label write lost a race, or a
# head that moved only by a base merge (restamp-base-merge.py carries the v3
# card across it) — goes back to review:outstanding-issues / no-blockers from
# the card's own bucket counts (validate-pinned.py count-buckets, the same
# call every publish path uses).
#
# Which card: `pinned-comment.sh last-reviewed-sha`, which prefers the v3
# author card. This job used to take the first `CLAUDE_REVIEW 1/` comment,
# and on #21066 that was a legacy monolith left from August: every run
# re-staled a PR whose v3 card was current, undoing each `#update-review`
# two hours later.
#
# Deterministic — no model calls. Mutations are label transitions and the
# base-merge head restamp (head carriers only; see restamp-base-merge.py).

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  actions: write # re-evaluate the Sentinel after a restamp or an un-stale

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review scripts (default branch)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/review-v3
            .claude/commands/docs-review
            .github

      - name: Reconcile review labels against PR heads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SENTINEL_MODE: ${{ vars.REVIEW_V3_SENTINEL }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml >/dev/null 2>&1 || true
          SCRIPTS=.claude/commands/docs-review/scripts

          # reviewed_sha <pr>: the SHA the live review covers (v3 card first).
          reviewed_sha() {
            bash "$SCRIPTS/pinned-comment.sh" last-reviewed-sha --pr "$1" --repo "$REPO" 2>/dev/null || true
          }
          # sentinel <pr>: re-evaluate the merge gate. A restamp moves the card
          # head (G1's input) and an un-stale moves the label, but neither
          # fires an event the Sentinel listens to: GITHUB_TOKEN writes start
          # no workflow. Without this, a card the cron repaired kept G1 red
          # until something else poked it (the #21673 symptom).
          sentinel() {
            case "$SENTINEL_MODE" in report|1) ;; *) return 0 ;; esac
            gh workflow run review-sentinel.yml --repo "$REPO" -f pr_number="$1" \
              || echo "PR #$1: Sentinel dispatch failed; the next event re-evaluates it"
          }
          # restamped <pr>: true when a base-only merge was carried across.
          restamped() {
            python3 scripts/review-v3/restamp-base-merge.py --repo "$REPO" --pr "$1" \
              | tee /dev/stderr | jq -r '.restamped' 2>/dev/null || echo false
          }

          prs=$(
            {
              gh pr list --repo "$REPO" --state open --label review:no-blockers \
                --json number --jq '.[].number'
              gh pr list --repo "$REPO" --state open --label review:outstanding-issues \
                --json number --jq '.[].number'
            } | sort -un
          )
          [ -z "$prs" ] && echo "no open PRs carry a terminal review label"

          for pr in $prs; do
            head_sha=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)

            # The live review (v3 author card first — see the header).
            body=$(bash "$SCRIPTS/pinned-comment.sh" fetch --pr "$pr" --repo "$REPO" 2>/dev/null || true)
            if [ -z "$body" ]; then
              echo "PR #$pr: no pinned review found; skipping"
              continue
            fi

            reviewed=$(reviewed_sha "$pr")

            if [ -n "$reviewed" ]; then
              case "$head_sha" in
                "$reviewed"*)
                  echo "PR #$pr: reviewed SHA $reviewed matches head; fresh"
                  continue
                  ;;
              esac
              if [ "$(restamped "$pr")" = "true" ]; then
                echo "PR #$pr: head moved only by a base merge since $reviewed; review carried across"
                sentinel "$pr"
                continue
              fi
              echo "PR #$pr: reviewed SHA $reviewed != head $head_sha; marking stale"
            else
              # Timestamp fallback, 10-minute slack. Skip when indeterminate.
              updated=$(printf '%s\n' "$body" \
                | grep -oE 'Last updated [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z?' \
                | head -1 | sed 's/Last updated //' || true)
              if [ -z "$updated" ]; then
                echo "PR #$pr: no reviewed SHA or timestamp recoverable; skipping"
                continue
              fi
              head_date=$(gh api "repos/$REPO/commits/$head_sha" --jq '.commit.committer.date')
              upd_s=$(date -u -d "$updated" +%s)
              head_s=$(date -u -d "$head_date" +%s)
              if [ $((head_s - upd_s)) -le 600 ]; then
                echo "PR #$pr: head commit not newer than review timestamp (+10m slack); fresh"
                continue
              fi
              echo "PR #$pr: head commit ($head_date) postdates review ($updated); marking stale"
            fi

            # Same transition mark-stale applies; the two terminal labels are
            # mutually exclusive by convention.
            labels=$(gh pr view "$pr" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')
            if [[ ",$labels," == *",review:outstanding-issues,"* ]]; then
              gh pr edit "$pr" --repo "$REPO" \
                --add-label "review:stale" --remove-label "review:outstanding-issues"
            elif [[ ",$labels," == *",review:no-blockers,"* ]]; then
              gh pr edit "$pr" --repo "$REPO" \
                --add-label "review:stale" --remove-label "review:no-blockers"
            fi
          done

          # ---- review:stale on a review that is current -------------------
          staled=$(gh pr list --repo "$REPO" --state open --label review:stale \
            --json number --jq '.[].number' | sort -un)
          for pr in $staled; do
            head_sha=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)
            reviewed=$(reviewed_sha "$pr")
            [ -n "$reviewed" ] || { echo "PR #$pr: stale, no reviewed SHA; leaving it"; continue; }
            case "$head_sha" in
              "$reviewed"*) ;;
              *)
                if [ "$(restamped "$pr")" != "true" ]; then
                  echo "PR #$pr: stale and genuinely behind ($reviewed vs $head_sha); leaving it"
                  continue
                fi
                ;;
            esac
            counts=$(python3 "$SCRIPTS/validate-pinned.py" count-buckets --pr "$pr" --repo "$REPO" 2>/dev/null || true)
            outstanding=$(printf '%s\n' "$counts" | grep '^outstanding=' | cut -d= -f2 || true)
            if ! [[ "$outstanding" =~ ^[0-9]+$ ]]; then
              echo "PR #$pr: review current but its buckets didn't count; leaving review:stale"
              continue
            fi
            if [ "$outstanding" -gt 0 ]; then label=review:outstanding-issues; else label=review:no-blockers; fi
            echo "PR #$pr: review is current at $head_sha; review:stale → $label"
            bash "$SCRIPTS/set-review-label.sh" --pr "$pr" --repo "$REPO" --label "$label" || true
            sentinel "$pr"
          done

          # ---- orphaned review:in-progress -------------------------------
          stuck=$(gh pr list --repo "$REPO" --state open --label review:in-progress \
            --json number --jq '.[].number' | sort -un)
          [ -z "$stuck" ] && { echo "no open PRs carry review:in-progress"; exit 0; }
          now_s=$(date -u +%s)
          for pr in $stuck; do
            # Most recent `labeled review:in-progress` event.
            labeled_at=$(gh api --paginate "repos/$REPO/issues/$pr/timeline" \
              --jq '[.[] | select(.event == "labeled" and .label.name == "review:in-progress") | .created_at] | last // empty' \
              2>/dev/null | tail -1 || true)
            if [ -z "$labeled_at" ]; then
              echo "PR #$pr: in-progress label has no timeline event; skipping"
              continue
            fi
            age_s=$(( now_s - $(date -u -d "$labeled_at" +%s) ))
            if [ "$age_s" -lt 1800 ]; then
              echo "PR #$pr: in-progress for ${age_s}s (< 30m); leaving it"
              continue
            fi
            # A live run's spinner is the "Reviewing —" body; a terminal
            # rewrite ("Review errored" / "timed out" / "superseded") is not.
            # --paginate runs the jq per page; sum the per-page counts so a
            # spinner on an earlier page is not missed.
            live=$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
              --jq '[.[] | select(.body | startswith("<!-- CLAUDE_PROGRESS -->")) | select(.body | test("Reviewing|starting a fresh review"))] | length' \
              2>/dev/null | awk '{ s += $1 } END { print s + 0 }')
            if [ "${live:-0}" -gt 0 ]; then
              echo "PR #$pr: in-progress for ${age_s}s with a live spinner; a run may still be going"
              continue
            fi
            # A requested run signals with a 👀 on the request instead of a
            # spinner. Only comments carrying any 👀 are worth a lookup.
            eyes=0
            for kind in issues pulls; do
              for cid in $(gh api --paginate "repos/$REPO/$kind/$pr/comments" \
                  --jq '.[] | select(.reactions.eyes > 0) | .id' 2>/dev/null); do
                n=$(gh api "repos/$REPO/$kind/comments/$cid/reactions?content=eyes" \
                  --jq '[.[] | select(.user.login == "github-actions[bot]")] | length' 2>/dev/null || echo 0)
                eyes=$(( eyes + ${n:-0} ))
              done
            done
            if [ "$eyes" -gt 0 ]; then
              echo "PR #$pr: in-progress for ${age_s}s with a live 👀 on a request; a run may still be going"
              continue
            fi
            echo "PR #$pr: review:in-progress for ${age_s}s with no live progress signal; marking stale"
            gh pr edit "$pr" --repo "$REPO" \
              --add-label "review:stale" --remove-label "review:in-progress"
          done
