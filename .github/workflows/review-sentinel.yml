name: Sentinel

# The v3 merge gate. One check-run ("Sentinel") answers "is this PR
# mergeable?": review ran at head, every finding answered, the matrix-named
# human approved, infra changes carry staging evidence. scripts/review-v3/
# sentinel.py is the evaluator (deterministic, no model, no AWS); this
# workflow only gathers a PR number, runs it, and publishes the check-run.
#
# SECURITY INVARIANT: this runs on `pull_request_target`, which carries
# write permissions and secrets on events a fork PR can trigger. It is safe
# ONLY because it never checks out or executes PR code: the single checkout
# below is pinned to the base repository's default branch, the evaluator
# reads PR state through the GitHub API as data, and nothing here feeds
# PR-controlled content to a shell. test_sentinel.py enforces this by
# asserting the workflow never references a PR head ref. Keep it that way —
# a later edit that checks out the head "just to classify the diff" turns
# this into a credential-exfiltration vector.
#
# Re-evaluation triggers deliberately cover every event that can change a
# gate's answer: pushes and label changes (pull_request_target), approvals
# and dismissals (pull_request_review — required checks do NOT re-run on
# review events by themselves, this wiring is why the sentinel notices), and
# both review lanes finishing (workflow_run). /resolve dispatches are
# covered by pull_request_target's `labeled`? No — the resolve workflow's
# comment PATCH fires no PR event, so review-resolve.yml pokes this
# workflow via workflow_dispatch when it applies dispositions.
#
# Rollout switch — the repo variable REVIEW_V3_SENTINEL is tri-state:
#   unset    → DARK. The job never runs, no check-run is posted, and the
#              review lanes' "Re-evaluate Sentinel" pokes are skipped. This
#              is the state the workflow file merges in (Phase 0/1): merging
#              must change nothing a contributor can see.
#   'report' → report-only (Phase 2). The check concludes `neutral` with
#              the real verdict in the summary ("REPORT-ONLY — would be: …").
#   '1'      → enforcing (Phase 4): real conclusions, made required by the
#              ruleset.
# Every comparison is written against a literal on purpose — `vars.X != '0'`
# is TRUE for unset (the blog-review lesson), so "unset" is never a truthy
# branch anywhere below.
#
# NO CONCURRENCY GROUP, on purpose. A cancelled job renders as a failing
# check on the PR ("Sentinel / sentinel — Cancelled"), and a group cancels
# the older pending job even with cancel-in-progress off, so any burst of
# triggers put a red ✗ in the merge box (65 of 200 runs, 2026-09-12 → 14).
# Overlapping runs are cheap (no model, ~50 s) and are made safe by two
# things instead: the job-level `if` below ignores label events for labels
# the evaluator never reads (triage's `domain:*` batch on open was most of
# the burst), and scripts/review-v3/publish_guard.py refuses to publish a
# verdict when the PR head has moved or a newer run already published at
# this head (every check-run carries `external_id = run id`). A guarded-out
# run concludes success with a ::notice::, never cancelled.

on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    # `edited` matters: G5 reads `sentinel:oversized-ack` out of the approving
    # review's BODY, so the natural human sequence — approve, see the red gate
    # explaining the magic string, edit the review to add it — fired no event
    # at all. The gate stayed red on a PR that satisfied it, and an oversized
    # PR is exactly the one you do not want re-pushed to shake an event loose.
    types: [submitted, dismissed, edited]
  workflow_run:
    workflows: ["Pre-merge Review (main)", "Pre-merge Review (update-review)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to evaluate
        required: true

permissions:
  checks: write
  # `pull-requests: write`, not `issues: write`, is what lets this job write
  # the pinned status comment and the ⛔ strip. Both go through
  # `POST/PATCH /repos/{o}/{r}/issues/{n}/comments`, and the endpoint's name
  # is a trap: on a PR number that endpoint is governed by the
  # **pull_requests** scope, not `issues`. The old block asked for
  # `issues: write` + `pull-requests: read` and looked right for months
  # because neither writer had ever run — the strip only fires when
  # enforcing, and the status comment did not exist. The first real POST
  # (PR #21642, 2026-09-16) failed with exit 1. `issues: write` is kept
  # because gh's own endpoint naming keeps inviting it back; it is not the
  # one doing the work.
  pull-requests: write
  issues: write
  contents: read
  id-token: write      # ESC OIDC for the org-scoped team-membership token

env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-docs
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false

jobs:
  sentinel:
    # Label events re-evaluate only for the labels the evaluator reads; every
    # other label change cannot move a gate. Keep this list in step with
    # sentinel.py — a label the evaluator reads but this list omits still
    # works, but only on the NEXT event. `sentinel:preview` was in exactly
    # that position: the lanes that apply it label the PR just after opening
    # it, so the `opened` run predates the label and the preview comment
    # waited for a later event.
    #
    # `automation/merge` is read through the CONFIG rather than a constant in
    # sentinel.py (`not_governed.author_label_pairs`), which is why it was
    # missed — and it flips the verdict hardest of all: present ⇒ success
    # with no gates evaluated. Its lane applies it *after* opening the PR
    # and then arms auto-merge, so the Sentinel stayed red on a bot regen
    # nobody pushes to and auto-merge never completed.
    #
    # `test_label_event_filter_covers_every_label_the_evaluator_reads`
    # derives this list from the evaluator's constants and review-routing.yml
    # rather than restating it, so a sixth label cannot go missing the same way.
    if: |
      (vars.REVIEW_V3_SENTINEL == 'report' || vars.REVIEW_V3_SENTINEL == '1') &&
      (github.event_name != 'pull_request_target' ||
       (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'review:waived' ||
       github.event.label.name == 'review:oversized' ||
       github.event.label.name == 'review:trivial' ||
       github.event.label.name == 'review:prose-flagged' ||
       github.event.label.name == 'automation/merge' ||
       github.event.label.name == 'sentinel:preview')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve PR number
        id: pr
        env:
          EVENT_PR: ${{ github.event.pull_request.number }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -uo pipefail
          PR="${EVENT_PR:-${RUN_PR:-${INPUT_PR:-}}}"
          # INPUT_PR is free text from workflow_dispatch, and this value is
          # interpolated into later `run:` blocks as ${{ steps.pr.outputs.pr }}.
          # Dispatching needs write access so this is defence in depth, not a
          # fork vector — but an unvalidated value here is both a shell
          # injection and, via `=` or a newline, a way to forge other step
          # outputs through GITHUB_OUTPUT. Digits only.
          case "$PR" in
            ''|*[!0-9]*)
              if [ -n "$PR" ]; then
                echo "::error::PR number is not numeric: refusing to evaluate."
              else
                echo "No PR number resolvable from this event; nothing to evaluate."
              fi
              echo "pr=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "pr=$PR" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Fetch secrets from ESC
        # continue-on-error: sentinel.py treats a missing/failing team-read
        # token as gate-3 ERROR ⇒ action_required — fail closed, never
        # fail-open and never fail the whole evaluation (the other four
        # gates still report). Also lets the fork battery run without ESC.
        if: steps.pr.outputs.pr != ''
        id: esc-secrets
        continue-on-error: true
        uses: pulumi/esc-action@v3

      # Base repo default branch ONLY — see the SECURITY INVARIANT above.
      #
      # Sparse, because this was the whole job's runtime. A full worktree is
      # ~1.2 GB (content/ alone is 860 MB) and the evaluator reads ~7 MB of
      # it: its own package, the docs-review scripts it loads
      # (compose-review, validate-pinned, and triage-classify via
      # replay-mechanical — compose-review also reads footer*.md from its
      # parent, so the whole docs-review directory comes along), and
      # review-routing.yml. Checkout was running 20 s to 3m40s; nothing else
      # in the job takes more than a few seconds.
      #
      # test_sentinel.py pins this list against the paths sentinel.py
      # actually loads — a new dependency outside these roots fails the
      # suite rather than only the one PR whose code path reaches it.
      - name: Checkout base (default branch)
        if: steps.pr.outputs.pr != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: |
            scripts/review-v3
            .claude/commands/docs-review
            .github
          sparse-checkout-cone-mode: true

      - name: Set up Python
        if: steps.pr.outputs.pr != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install evaluator deps
        if: steps.pr.outputs.pr != ''
        run: python3 -m pip install --quiet pyyaml

      - name: Evaluate
        if: steps.pr.outputs.pr != ''
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org-scoped token for the two membership endpoints G3 reads —
          # org team membership, and (for `approval.admins_satisfy`) the
          # approver's effective repo permission, which wants push access.
          # The default GITHUB_TOKEN can do neither. sentinel.py treats
          # lookup failures as action_required, never as "not a member", so
          # a missing/expired token degrades loud, not wrong.
          GH_TOKEN_TEAM_READ: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
          REPORT_ONLY: ${{ vars.REVIEW_V3_SENTINEL != '1' }}
        run: |
          # --status-comment is passed unconditionally on purpose: the
          # evaluator decides whether to actually write. Enforcing mode
          # always maintains the pinned comment; report-only mode does so
          # only for a PR someone labelled `sentinel:preview`, so the dry
          # run stays invisible to contributors who didn't opt in.
          ARGS=(--repo "${{ github.repository }}" --pr "${{ steps.pr.outputs.pr }}"
                --status-comment)
          if [ "$REPORT_ONLY" = "true" ]; then
            ARGS+=(--report-only)
          else
            ARGS+=(--update-strip)
          fi
          python3 scripts/review-v3/sentinel.py "${ARGS[@]}" > verdict.json
          cat verdict.json

      # Overlapping runs are expected (no concurrency group — see the header).
      # Publish only when this run still holds the newest verdict for the
      # PR's current head; otherwise conclude success with a notice.
      - name: Publish guard
        if: steps.pr.outputs.pr != ''
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/review-v3/publish_guard.py \
            --repo "${{ github.repository }}" --pr "${{ steps.pr.outputs.pr }}" \
            --run-id "${{ github.run_id }}" --verdict verdict.json

      - name: Publish check-run
        if: steps.pr.outputs.pr != '' && steps.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq --arg run_id "${{ github.run_id }}" \
             '{name: "Sentinel", head_sha: .head_sha, status: "completed",
               conclusion: .conclusion, external_id: $run_id,
               output: {title: .title, summary: .summary}}' verdict.json \
          | gh api --method POST "repos/${{ github.repository }}/check-runs" --input -
