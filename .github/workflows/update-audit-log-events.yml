# Git pushes, PR creation, and auto-merge all use PULUMI_BOT_TOKEN (a PAT from
# ESC), so the built-in GITHUB_TOKEN only needs id-token: write for esc-action's
# OIDC auth and contents: read for the default checkout in the pull-request job.
permissions:
  contents: read
  id-token: write

env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-docs
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false

name: Audit Logs - Update Events
on:
  workflow_dispatch:
    inputs:
      skip_auto_merge:
        description: "Skip enabling auto-merge on the generated PR (for testing)"
        type: boolean
        default: false
  schedule:
    # Nightly at 07:15 UTC, keeping the audit log events reference in sync with
    # the Pulumi Cloud API. Offset from the ESC schema job (07:00) and the
    # policy pack job (07:30) so the data-committing workflows don't race.
    - cron: "15 7 * * *"
jobs:
  update-audit-log-events:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.commit.outputs.has_changes }}
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v3
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          token: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
      - name: Install Python dependencies
        run: python3 -m pip install --quiet pyyaml
      - name: Fetch audit log events
        run: ./scripts/fetch-audit-log-events.sh
        env:
          PULUMI_ACCESS_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_ACCESS_TOKEN }}
      - name: git status
        run: git status && git diff
      - name: Commit changes
        id: commit
        run: |
          git config --local user.email "bot@pulumi.com"
          git config --local user.name "pulumi-bot"
          git checkout -b audit-log-events/${{ github.run_id }}-${{ github.run_number }}
          git add data/audit_log_events.json
          if git diff --cached --quiet; then
            echo "No audit log event changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            # The catalog actually changed. Stamp the "last updated" date the
            # reference page renders (data/audit_log_events_updated.json). This
            # is gated on a real diff so the date advances only when the events
            # change, never on a no-op nightly refresh. The date file is kept
            # separate from audit_log_events.json so the no-change check above
            # stays byte-exact.
            printf '{\n  "updated": "%s"\n}\n' "$(date -u +%F)" > data/audit_log_events_updated.json
            git add data/audit_log_events_updated.json
            git commit -m "Update audit log events"
            git push origin audit-log-events/${{ github.run_id }}-${{ github.run_number }}
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
  pull-request:
    runs-on: ubuntu-latest
    needs: update-audit-log-events
    if: needs.update-audit-log-events.outputs.has_changes == 'true'
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v3
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Open pull request
        id: create-pr
        uses: repo-sync/pull-request@v2
        with:
          source_branch: "audit-log-events/${{ github.run_id }}-${{ github.run_number }}"
          destination_branch: "master"
          pr_title: "Update audit log events"
          pr_body: "Automated regeneration of `data/audit_log_events.json` from the Pulumi Cloud audit log event types API. Renders the audit log events reference at /docs/administration/reference/audit-log-events/."
          pr_label: "automation/merge"
          github_token: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
      - name: Enable auto-merge
        if: steps.create-pr.outputs.pr_created == 'true' && github.event.inputs.skip_auto_merge != 'true'
        run: gh pr merge ${{ steps.create-pr.outputs.pr_number }} --auto --squash
        env:
          GITHUB_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
  notify:
    if: failure()
    name: Send slack notification
    runs-on: ubuntu-latest
    needs: [update-audit-log-events, pull-request]
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v3
      - name: Slack Notification
        uses: docker://sholung/action-slack-notify:v2.3.0
        env:
          SLACK_CHANNEL: docs-ops
          SLACK_COLOR: "#F54242"
          SLACK_MESSAGE: "Audit log event update failure in pulumi/docs repo :meow_sad:"
          SLACK_USERNAME: docsbot
          SLACK_WEBHOOK: ${{ steps.esc-secrets.outputs.SLACK_WEBHOOK_URL }}
          SLACK_ICON: https://www.pulumi.com/logos/brand/avatar-on-white.png
