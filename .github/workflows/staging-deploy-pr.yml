name: Staging deploy (PR)

# `/deploy-staging` — a tools-team member asks for a pulumi-test.io staging
# deploy of a PR branch, producing the commit status the Sentinel's
# infra-evidence gate (G4) requires. The proposal's rule is that infra
# changes carry a green staging deploy recorded at head SHA, with no waiver;
# this workflow is how that evidence gets made.
#
# Design notes:
# - Permission gate: only active members of the tools team (teams.tools in
#   .github/review-routing.yml) may trigger a deploy. Checked in-job via the
#   org membership API with the PULUMI_BOT_TOKEN (the default GITHUB_TOKEN
#   cannot read team membership); an API failure refuses (fail closed).
# - Fork PRs are refused with a comment: deploying fork code to the shared
#   staging stack is a tools-team manual action, not a comment command.
# - This workflow never checks out ANY code. It dispatches the existing
#   "Build and deploy testing" workflow at the PR's same-repo head branch
#   (that workflow checks out and builds in the testing account, as it does
#   for master), polls the run, and records the outcome as commit status
#   `staging/pulumi-test-io` at the deployed head SHA. Sentinel G4 checks
#   that status at the PR's CURRENT head — a later push clears the evidence
#   automatically (fails closed).
# - Concurrency: the staging stack is one shared environment, so deploys
#   queue (`staging-stack` group, no cancel-in-progress). GitHub holds at
#   most one PENDING run per group and silently drops the one a newer
#   request displaces — and a dropped run never starts, so nothing inside
#   it can post a notice. The honest alternative is up front: when a deploy
#   is already running, the job tells the requester it is queued behind it
#   and that a third request would displace this one, so they know to
#   re-run `/deploy-staging` if no status ever lands.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  statuses: write
  actions: write       # gh workflow run + gh run watch
  id-token: write      # ESC OIDC

concurrency:
  group: staging-stack

env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-docs
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false

jobs:
  deploy:
    # The commit status this writes is Sentinel gate 4's evidence; without a
    # Sentinel to read it the command is inert, so it follows the same switch.
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, '/deploy-staging') && (vars.REVIEW_V3_SENTINEL == 'report' || vars.REVIEW_V3_SENTINEL == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v3

      - name: Gate and gather PR facts
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAM_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
          ACTOR: ${{ github.event.comment.user.login }}
          PR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          refuse() {
            gh api --method POST "repos/$REPO/issues/$PR/comments" \
              -f body="$1" >/dev/null
            echo "refused=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Tools-team membership, fail closed on any lookup problem. No
          # checkout has happened, so read the routing config through the
          # contents API (this workflow never checks out code).
          TEAM_REF=$(gh api "repos/$REPO/contents/.github/review-routing.yml" --jq .content | base64 -d | python3 -c "import sys,yaml;print(yaml.safe_load(sys.stdin)['teams']['tools'])")
          ORG="${TEAM_REF%%/*}"; SLUG="${TEAM_REF#*/}"
          STATE=$(GH_TOKEN="$TEAM_TOKEN" gh api "orgs/$ORG/teams/$SLUG/memberships/$ACTOR" --jq .state 2>/dev/null || echo "lookup-failed")
          if [ "$STATE" != "active" ]; then
            refuse "@$ACTOR \`/deploy-staging\` is limited to **$TEAM_REF** members (membership check: \`$STATE\`). Ask a tools-team member to trigger the staging deploy."
          fi

          PR_JSON=$(gh api "repos/$REPO/pulls/$PR")
          HEAD_SHA=$(echo "$PR_JSON" | jq -r .head.sha)
          HEAD_REF=$(echo "$PR_JSON" | jq -r .head.ref)
          HEAD_REPO=$(echo "$PR_JSON" | jq -r .head.repo.full_name)
          if [ "$HEAD_REPO" != "$REPO" ]; then
            refuse "@$ACTOR this PR's head lives on a fork (\`$HEAD_REPO\`). Staging deploys of fork code are a tools-team manual action — see BUILD-AND-DEPLOY.md."
          fi
          {
            echo "refused=false"
            echo "head_sha=$HEAD_SHA"
            echo "head_ref=$HEAD_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch testing deploy and record status
        if: steps.gate.outputs.refused == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          HEAD_REF: ${{ steps.gate.outputs.head_ref }}
        run: |
          set -euo pipefail
          # Queue transparency (see the concurrency note in the header): if a
          # deploy is already running, say so before dispatching — a run this
          # one displaces from the pending slot never starts, so this is the
          # only moment a notice can be posted.
          BUSY=$(gh run list --repo "$REPO" --workflow testing-build-and-deploy.yml \
                   --status in_progress --limit 1 --json url --jq '.[0].url // empty')
          if [ -n "$BUSY" ]; then
            gh api --method POST "repos/$REPO/issues/$PR/comments" \
              -f body="⏳ A staging deploy is already running ($BUSY); this request is queued behind it. GitHub keeps one queued deploy at a time, so a newer \`/deploy-staging\` before that one finishes would drop this request silently — if no \`staging/pulumi-test-io\` status lands on \`${HEAD_SHA:0:9}\`, re-run \`/deploy-staging\`." >/dev/null
          fi
          # The dispatch API returns nothing. Stamp the time first and select
          # the first workflow_dispatch run on this branch created after it —
          # `--limit 1` on the branch would happily pick up an earlier push
          # or /deploy-staging run and post ITS outcome as this head's status.
          SINCE=$(date -u +%FT%TZ)
          gh workflow run testing-build-and-deploy.yml --repo "$REPO" --ref "$HEAD_REF"
          RUN_ID=""
          for i in $(seq 1 12); do
            sleep 5
            RUN_ID=$(gh run list --repo "$REPO" --workflow testing-build-and-deploy.yml \
                       --branch "$HEAD_REF" --event workflow_dispatch --limit 10 \
                       --json databaseId,createdAt \
                       --jq "[.[] | select(.createdAt > \"$SINCE\")] | sort_by(.createdAt) | first | .databaseId // empty")
            [ -n "$RUN_ID" ] && break
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::could not locate the dispatched testing deploy run (no workflow_dispatch run on $HEAD_REF created after $SINCE within 60 s)"
            exit 1
          fi
          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=pending -f context="staging/pulumi-test-io" \
            -f target_url="$RUN_URL" \
            -f description="staging deploy running" >/dev/null
          gh api --method POST "repos/$REPO/issues/$PR/comments" \
            -f body="🚀 Staging deploy of \`$HEAD_REF\` @ \`${HEAD_SHA:0:9}\` started: $RUN_URL — the \`staging/pulumi-test-io\` status lands here when it finishes. (Next merge to master resets pulumi-test.io.)" >/dev/null

          if gh run watch "$RUN_ID" --repo "$REPO" --exit-status; then
            STATE=success; DESC="staging deploy green"
          else
            STATE=failure; DESC="staging deploy failed"
          fi
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" -f context="staging/pulumi-test-io" \
            -f target_url="$RUN_URL" -f description="$DESC" >/dev/null
