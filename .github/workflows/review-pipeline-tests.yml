name: Review pipeline tests

# Runs the review pipelines' own test suites (pre-merge PR review, daily
# content review, blog known-issues index) on any PR that touches them.
#
# These suites already existed and were green, but nothing ran them: `make
# test` covers only the example programs, and no workflow invoked pytest or a
# --self-test. Unrun tests rot — test_select_posts.py had been erroring under
# pytest collection for some time and nobody saw it, because nothing collected
# it. Running them on every pipeline PR is what keeps them honest.
#
# Note what this job does and does not buy: it only catches what the suites
# actually assert. The selector bot-author defect fixed alongside this workflow
# was NOT covered by any suite, so a green run would have shipped it — a
# regression test for it was added at the same time. Coverage is the suites'
# job; this workflow's job is making sure they run.
#
# Path-filtered so it only fires on pipeline changes; content-only PRs (the
# large majority) never see this job.
on:
  pull_request:
    paths:
      - 'scripts/content-review/**'
      - 'scripts/blog-review/**'
      - 'scripts/review-v3/**'
      - 'scripts/test-review-pipeline.sh'
      - '.claude/commands/docs-review/scripts/**'
      # The suites assert against the shipped strategic-tiers.yaml and
      # upstream-claims.yaml (which lane each generated tree lands in, which
      # pages are retirement-vetoed, that every upstream entry cites an issue),
      # so a data-only edit to those files must run them too.
      - '.claude/commands/review-existing-content/references/**'
      # The routing suite asserts against the shipped lane config (team slugs
      # resolvable, matrix complete, SLA entries present), so a config-only
      # edit must run it too.
      - '.github/review-routing.yml'
      - '.github/workflows/review-pipeline-tests.yml'

permissions:
  contents: read

concurrency:
  group: review-pipeline-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Run review-pipeline test suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test deps
        run: python3 -m pip install --quiet pytest pyyaml
      - name: Run suites
        run: ./scripts/test-review-pipeline.sh
