name: Staging deploy status

# Finalizes the `staging/pulumi-test-io` commit status for a dispatched
# pulumi-test.io staging deploy — the evidence Sentinel gate G4 reads — and
# pokes the Sentinel so G4 is re-scored against it.
#
# THE RULE THIS INCIDENT WROTE: anything that must work for PR branches of
# ANY AGE lives in a workflow GitHub triggers from the DEFAULT BRANCH —
# `workflow_run`, `schedule`, `pull_request_target`, or a dispatch pinned to
# the default ref. A `workflow_dispatch` runs the workflow FILE FROM THE REF
# IT IS DISPATCHED AT, so a job added to `testing-build-and-deploy.yml` on
# master does not exist in a run dispatched at a branch cut before it landed.
# The dispatch side already follows the rule: `staging-deploy-auto.yml` runs
# base's scripts and pins its checkout to the default branch. The finalize
# side did not — it was a job inside the dispatched run — and PR #21676
# (branched from 8712bb8b, before that job merged) paid for it: the deploy
# succeeded at 23:52Z on 2026-09-16, nothing wrote the terminal status, and
# the merge box sat on "staging deploy running" indefinitely. `workflow_run`
# listeners always execute the default branch's copy and fire for runs on any
# branch, which makes branch age irrelevant. Keep finalization here.
#
# Design notes:
# - DISPATCHED, NON-DEFAULT-BRANCH RUNS ONLY. A master push deploy is not
#   anybody's staging evidence and must not have a `staging/pulumi-test-io`
#   status written at its SHA; a manual dispatch at master is the same. Both
#   are filtered by the job `if` (and re-checked for the backfill entry,
#   which takes an arbitrary run id).
# - THE PR IS RESOLVED BY HEAD BRANCH. `workflow_run.pull_requests[]` is
#   EMPTY for a run started by workflow_dispatch — the same gap
#   claude-code-review.yml's publish job works around by poking the Sentinel
#   explicitly. Head branch is the only handle this event carries, and the
#   auto lane dispatches at the PR's head branch, so it resolves.
# - THE STATUS IS WRITTEN EVEN WHEN NO PR RESOLVES. The status belongs to the
#   SHA, not to the PR; resolving a PR is only needed for the Sentinel poke.
#   A closed/renamed branch therefore still gets its pending status cleared.
# - ONE WRITER. This workflow is the only thing that writes a terminal
#   `staging/pulumi-test-io`. `staging-deploy.sh` writes only the PENDING
#   status, because that has to happen at dispatch time, and its watch path
#   (`/deploy-staging`, which blocks to hold that lane's `staging-stack`
#   concurrency group) was stripped of its status write when this landed.
# - NO PR CODE, EVER. This job holds `statuses: write` and `actions: write`
#   on a run whose head is PR-controlled. It checks out nothing and runs
#   nothing from the PR; every fact comes from the API as data. If a script
#   is ever needed here, pin the checkout to
#   `github.event.repository.default_branch`, sparse `scripts/review-v3` —
#   the same shape as staging-deploy-auto.yml. test_sentinel.py enforces it.
# - NO CONCURRENCY GROUP, for the reason the Sentinel and the auto lane
#   don't have one: a displaced pending run is a CANCELLED run, and these
#   finalize a status the merge box shows. Overlapping runs are cheap and
#   safe — each writes one SHA's status, and two deploys of the same SHA
#   agree.
# - `target_url` POINTS AT THE DEPLOYED SITE ON SUCCESS. The Actions run
#   already has a link in the Sentinel's G4 row; what the merge box is good
#   for is "show me the thing you deployed". On a failure or a cancellation
#   there is nothing deployed to look at, so those keep the run link.
# - BACKFILL. `workflow_dispatch` with a `run_id` replays this against a
#   completed deploy — for clearing a phantom pending status left by a run
#   that predates this listener, without spending eight minutes re-deploying.

on:
  workflow_run:
    workflows: ["Build and deploy testing"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a completed 'Build and deploy testing' dispatch to finalize"
        required: true
      pr_number:
        description: "PR to re-evaluate (optional; resolved from the run's head branch when omitted)"
        required: false

permissions:
  contents: read
  statuses: write
  pull-requests: read
  actions: write       # gh workflow run review-sentinel.yml

jobs:
  finalize:
    # No concurrency group — see the header.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.event == 'workflow_dispatch'
          && github.event.workflow_run.head_branch != github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the deploy run
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          WR_ID: ${{ github.event.workflow_run.id }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          # pipefail is NOT GitHub's default (`bash -e`), and the jq reads
          # below are the whole point of the step — a gh failure upstream of
          # one must not be masked by jq exiting 0 on empty input.
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Backfill: the run id is operator-supplied, so re-apply every
            # guard the workflow_run job `if` applies to the live event.
            RUN_JSON=$(gh api "repos/$REPO/actions/runs/$INPUT_RUN_ID")
            RUN_ID="$INPUT_RUN_ID"
            SHA=$(jq -er .head_sha <<<"$RUN_JSON")
            BRANCH=$(jq -er .head_branch <<<"$RUN_JSON")
            CONCLUSION=$(jq -r '.conclusion // ""' <<<"$RUN_JSON")
            RUN_URL=$(jq -er .html_url <<<"$RUN_JSON")
            TRIGGER=$(jq -er .event <<<"$RUN_JSON")
            STATUS=$(jq -er .status <<<"$RUN_JSON")
            if [ "$TRIGGER" != "workflow_dispatch" ]; then
              echo "::error::run $RUN_ID was triggered by '$TRIGGER', not workflow_dispatch — it is not staging evidence for a PR"
              exit 1
            fi
            if [ "$STATUS" != "completed" ]; then
              echo "::error::run $RUN_ID is '$STATUS', not completed — nothing terminal to record yet"
              exit 1
            fi
            if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
              echo "::error::run $RUN_ID deployed '$DEFAULT_BRANCH' — the default branch is not a PR head and gets no staging status"
              exit 1
            fi
          else
            RUN_ID="$WR_ID"
            SHA="$WR_SHA"
            BRANCH="$WR_BRANCH"
            CONCLUSION="$WR_CONCLUSION"
            RUN_URL="$WR_URL"
          fi
          echo "run $RUN_ID: branch=$BRANCH sha=${SHA:0:9} conclusion=$CONCLUSION"
          {
            echo "run_id=$RUN_ID"
            echo "sha=$SHA"
            echo "branch=$BRANCH"
            echo "conclusion=$CONCLUSION"
            echo "run_url=$RUN_URL"
          } >> "$GITHUB_OUTPUT"

      # Only the Sentinel poke needs this; the status write does not. An
      # unresolvable PR is a notice, never a failure.
      - name: Resolve the PR from the head branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.run.outputs.branch }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -uo pipefail
          PR="${INPUT_PR:-}"
          if [ -z "$PR" ]; then
            # workflow_run.pull_requests[] is empty for a dispatched run —
            # see the header. The head branch is the only handle we have.
            PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
                   --json number --jq '.[0].number // empty') || PR=""
          fi
          if [ -z "$PR" ]; then
            echo "::notice::no open PR for branch '$BRANCH' — writing the status, skipping the Sentinel poke"
          else
            echo "PR #$PR"
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Write the terminal staging status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.run.outputs.sha }}
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
          RUN_URL: ${{ steps.run.outputs.run_url }}
        run: |
          set -euo pipefail
          # Same three descriptions the in-run job used, so nothing a reader
          # or a script has learned to recognize changes. `error` for
          # cancelled: it is neither a green deploy nor a broken build.
          case "$CONCLUSION" in
            success)   STATE=success; DESC="staging deploy green";     URL="https://www.pulumi-test.io" ;;
            cancelled) STATE=error;   DESC="staging deploy cancelled"; URL="$RUN_URL" ;;
            *)         STATE=failure; DESC="staging deploy failed";    URL="$RUN_URL" ;;
          esac
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state="$STATE" -f context="staging/pulumi-test-io" \
            -f target_url="$URL" -f description="$DESC" >/dev/null
          echo "staging/pulumi-test-io = $STATE at ${SHA:0:9} ($RUN_URL)"

      # G4 is evaluated when the Sentinel runs, and a deploy finishing fires
      # no PR event — so on #21676 the gate was scored red five minutes
      # before the deploy went green and stayed red. Poke it, exactly as
      # claude-code-review.yml's publish job does.
      - name: Re-evaluate Sentinel
        if: >-
          steps.pr.outputs.pr != ''
          && (vars.REVIEW_V3_SENTINEL == 'report' || vars.REVIEW_V3_SENTINEL == '1')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          set -euo pipefail
          gh workflow run review-sentinel.yml --repo "$REPO" -f pr_number="$PR"
