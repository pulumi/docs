# Dependabot configuration for pulumi/docs.
#
# Three things about this file are easy to get wrong; all are called out
# again at the point of use below.
#
# 1. Version updates for the site build and tooling arrive as ONE pull request
#    a month. Every entry in the first two sections joins the `monthly`
#    multi-ecosystem group defined below, so npm (six directories), GitHub
#    Actions, pip, and devcontainers all land in a single PR on the group's
#    schedule. Entries in a multi-ecosystem group take their schedule from the
#    group, must declare `patterns`, and may NOT set `commit-message` (it is
#    group-only; setting it on an entry is a configuration error).
#
# 2. Security updates ignore most of what you configure here. They are not
#    subject to `schedule`, they are not subject to `open-pull-requests-limit`,
#    they are not part of a multi-ecosystem group, and they are NOT covered by
#    a `groups` entry unless that entry carries `applies-to: security-updates`
#    (groups default to version updates). Every entry below therefore keeps a
#    security-specific group. Without it, one advisory day produces one PR per
#    affected package per manifest -- which is how this repo saw 9 PRs on
#    2026-07-23 and 11 on 2026-09-01. The best grouping available for them is
#    one PR per entry per advisory day.
#
# 3. The /static/programs entries at the bottom exist ONLY to batch security
#    PRs for 444 sample programs. They must keep `open-pull-requests-limit: 0`
#    and `applies-to: security-updates`, and must NOT join the multi-ecosystem
#    group. See the header above that block.

version: 2

multi-ecosystem-groups:
  # The one monthly version-update PR. Its schedule replaces the per-entry
  # schedules, and its commit-message applies to the combined PR.
  monthly:
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"

updates:
  # ===========================================================================
  # Site build
  #
  # Every entry here and under "CI and tooling" follows the same shape:
  #   multi-ecosystem-group: "monthly"  <- version updates go in the one PR
  #   patterns: ["*"]                   <- required by the multi-ecosystem group
  #   groups.security                   <- security PRs, batched per entry
  #   labels: ["dependencies"]          <- kept on the entry so security PRs,
  #                                        which are outside the group, still
  #                                        get it (labels are additive)
  # No `schedule` (the group owns it) and no `commit-message` (group-only).
  # ===========================================================================

  # Root package.json
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "monthly"
    patterns: ["*"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "tailwindcss"
      - dependency-name: "prettier"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]

  # Theme package.json
  - package-ecosystem: "npm"
    directory: "/theme"
    multi-ecosystem-group: "monthly"
    patterns: ["*"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "tailwindcss"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]

  # Stencil package.json. Built indirectly: scripts/ensure.sh installs it and
  # theme/webpack.config.js shells out to its build.
  - package-ecosystem: "npm"
    directory: "/theme/stencil"
    multi-ecosystem-group: "monthly"
    patterns: ["*"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]

  # Infrastructure package.json
  - package-ecosystem: "npm"
    directory: "/infrastructure"
    multi-ecosystem-group: "monthly"
    patterns: ["*"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]

  # Versioned-docs generator: a sibling Pulumi program to /infrastructure with
  # its own package.json and yarn.lock.
  - package-ecosystem: "npm"
    directory: "/infrastructure/versioned-docs"
    multi-ecosystem-group: "monthly"
    patterns: ["*"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]

  # snippet-sweep. The repo's only package-lock.json; everything else is yarn.
  - package-ecosystem: "npm"
    directory: "/scripts/snippet-sweep"
    multi-ecosystem-group: "monthly"
    patterns: ["*"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]

  # ===========================================================================
  # CI and tooling
  # ===========================================================================

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "monthly"
    patterns: ["*"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "pulumi/action-install-pulumi-cli"
    labels: ["dependencies"]

  # Python. The root /Pipfile is deliberately omitted: it declares no packages
  # and exists only to pin python_version.
  #
  # Only /tools/pydocgen is expected to produce updates today. It is the one
  # directory with real constraints (sphinx >=7.1,<7.2) and a Pipfile.lock.
  # /scripts/python and /scripts/image-borders pin every package as "*" and
  # ship no lock, so there is no resolved version to bump or to match against
  # an advisory -- they are listed here so that committing a Pipfile.lock is
  # the only step needed to make them live, but until then they are inert.
  - package-ecosystem: "pip"
    directories:
      - "/scripts/python"
      - "/scripts/image-borders"
      - "/tools/pydocgen"
    multi-ecosystem-group: "monthly"
    patterns: ["*"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]

  # Dev container base image and features. No security-advisory feed exists
  # for this ecosystem, so there is no security group.
  - package-ecosystem: "devcontainers"
    directory: "/"
    multi-ecosystem-group: "monthly"
    patterns: ["*"]
    labels: ["dependencies"]

  # ===========================================================================
  # Example programs -- SECURITY BATCHING ONLY
  #
  # /static/programs holds 444 sample directories that ship as documentation.
  # We do not want monthly version bumps for them (scripts/programs/upgrade.sh
  # and the scheduled-upgrade-programs workflow own that job). We only want the
  # security PRs that GitHub already opens against them -- e.g. #21304, #20771,
  # both raised with no config coverage at all -- collapsed into one PR per
  # ecosystem instead of one per directory.
  #
  # Every entry below MUST keep both of:
  #   open-pull-requests-limit: 0     <- turns version updates OFF for the entry
  #   applies-to: security-updates    <- without it the group covers version
  #                                      updates instead, and does nothing here
  # Drop either one and you enable monthly version updates across 444
  # directories. `schedule` is required by the schema but inert at limit 0.
  #
  # Manifests sit one level down (/static/programs/<program>/go.mod), so the
  # glob is /static/programs/*. Dockerfiles sit two levels down
  # (/static/programs/<program>/app/Dockerfile) and need the extra pattern.
  # ===========================================================================

  - package-ecosystem: "npm"
    directories: ["/static/programs/*"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      example-programs-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps(examples)"

  - package-ecosystem: "gomod"
    directories: ["/static/programs/*"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      example-programs-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps(examples)"

  - package-ecosystem: "pip"
    directories: ["/static/programs/*"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      example-programs-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps(examples)"

  - package-ecosystem: "nuget"
    directories: ["/static/programs/*"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      example-programs-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps(examples)"

  - package-ecosystem: "maven"
    directories: ["/static/programs/*"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      example-programs-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps(examples)"

  - package-ecosystem: "docker"
    directories: ["/static/programs/*/*"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      example-programs-security:
        applies-to: security-updates
        patterns: ["*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps(examples)"
